name: Pump Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: |
            trade_state.json
            signal_state.json
            performance.json
          key: pump-v5-${{ github.run_id }}
          restore-keys: |
            pump-v5-

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            trade_state.json
            signal_state.json
            performance.json
          key: pump-v5-${{ github.run_id }}
