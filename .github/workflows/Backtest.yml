name: Pump Detector 6M Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Pump Detector Backtest
        run: |
          python pump_detector.py

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pump-detector-results
          path: |
            pump_detector.db
            pump_trades.csv
          if-no-files-found: warn
