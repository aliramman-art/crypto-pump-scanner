name: VOLUME-KHAT 100 v7.6

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: volume-khat-v76
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scanner:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      # ======================================================
      # RUN SCANNER
      # ======================================================

      - name: Run VOLUME-KHAT 100 v7.6
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          echo "============================================================"
          echo "VOLUME-KHAT 100 v7.6"
          echo "============================================================"
          echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================================"

          python scanner.py

          echo "============================================================"
          echo "Scanner finished: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================================"

      # ======================================================
      # PERSIST SQLITE DATABASE
      # ======================================================

      - name: Persist SQLite database
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking database..."

          if [ -f volume_khat_100_v76.db ]; then
            echo "Database found:"
            ls -lh volume_khat_100_v76.db
          else
            echo "ERROR: volume_khat_100_v76.db not found."
            exit 1
          fi

          git add -f volume_khat_100_v76.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Persist VOLUME-KHAT v7.6 database"
            git push
          fi
