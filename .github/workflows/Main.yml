name: Crypto UT Bot Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Install packages
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      # ==========================================
      # 4. Check files
      # ==========================================

      - name: Check files
        run: |
          echo "======================================"
          echo "CHECKING PROJECT"
          echo "======================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Workflows:"
          ls -la .github/workflows || true

          echo ""

          if [ ! -f scanner.py ]; then
            echo "ERROR: scanner.py NOT FOUND"
            exit 1
          fi

          echo "OK: scanner.py FOUND"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "CCXT:"
          python -c "import ccxt; print(ccxt.__version__)"

          echo ""
          echo "Pandas:"
          python -c "import pandas; print(pandas.__version__)"

          echo ""
          echo "NumPy:"
          python -c "import numpy; print(numpy.__version__)"

          echo ""
          echo "Requests:"
          python -c "import requests; print(requests.__version__)"

      # ==========================================
      # 5. Run scanner
      # ==========================================

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"

        run: |

          echo "======================================"
          echo "STARTING SCANNER"
          echo "======================================"

          echo ""
          echo "UTC time:"
          date -u

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Scanner file:"
          ls -lh scanner.py

          echo ""
          echo "Running scanner.py ..."
          echo ""

          python -u scanner.py

          EXIT_CODE=$?

          echo ""
          echo "======================================"
          echo "SCANNER EXIT CODE: $EXIT_CODE"
          echo "======================================"

          exit $EXIT_CODE

      # ==========================================
      # 6. Save State / History
      # ==========================================

      - name: Save scanner state
        if: always()
        run: |

          echo "======================================"
          echo "SAVING SCANNER STATE"
          echo "======================================"

          echo ""
          echo "Generated files:"

          ls -lh \
            utbot_state.json \
            utbot_trade_history.json \
            .utbot_15m_reset_done \
            2>/dev/null || true

          echo ""
          echo "Git status before commit:"

          git status --short

          echo ""
          echo "Configuring Git..."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo ""
          echo "Adding scanner state..."

          git add \
            utbot_state.json \
            utbot_trade_history.json \
            .utbot_15m_reset_done \
            2>/dev/null || true

          echo ""
          echo "Checking staged changes..."

          git status --short

          if git diff --cached --quiet; then

            echo ""
            echo "NO STATE CHANGES TO COMMIT."

          else

            echo ""
            echo "COMMITTING SCANNER STATE..."

            git commit -m "Update UT Bot scanner state"

            echo ""
            echo "PUSHING STATE TO REPOSITORY..."

            git push

            echo ""
            echo "STATE SAVED SUCCESSFULLY."

          fi

      # ==========================================
      # 7. Finish
      # ==========================================

      - name: Finish
        if: always()
        run: |

          echo "======================================"
          echo "WORKFLOW FINISHED"
          echo "======================================"

          date -u

          echo ""
          echo "Final Git status:"

          git status --short

          echo ""
          echo "======================================"
          echo "UT BOT SCANNER COMPLETE"
          echo "======================================"
