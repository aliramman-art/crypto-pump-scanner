name: Crypto Price Action Scanner

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-price-action-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # =====================================================
      # RUN SCANNER
      # =====================================================
      - name: Run Price Action Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=========================================="
          echo "CRYPTO PRICE ACTION SCANNER"
          echo "=========================================="
          echo "Timeframe: 5m"
          echo "TOP: 30 abnormal-volume markets"
          echo "BOX: 26 candles"
          echo "TP: 50% Box Width"
          echo "MAX OPEN: 1"
          echo "=========================================="

          python -u scanner.py

      # =====================================================
      # SAVE STATE / HISTORY
      # =====================================================
      - name: Save scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add price_action_state.json price_action_trade_history.json || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update price action scanner state"
            git push
          fi
