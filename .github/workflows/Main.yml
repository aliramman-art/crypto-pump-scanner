name: Binance Futures Price Action Scanner

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-futures-price-action-scanner
  cancel-in-progress: false

jobs:

  scanner:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

          python -c "import requests; print('requests OK:', requests.__version__)"


      # ============================================================
      # CHECK SCANNER
      # ============================================================

      - name: Check Scanner
        run: |
          echo "=========================================="
          echo "CHECKING scanner.py"
          echo "=========================================="

          ls -la

          test -f scanner.py

          python -m py_compile scanner.py

          echo "scanner.py syntax OK"


      # ============================================================
      # RUN SCANNER
      # ============================================================

      - name: Run Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # CoinAPI
          COINAPI_KEY: ${{ secrets.COINAPI_KEY }}

          PYTHONUNBUFFERED: "1"

        run: |

          echo "=========================================="
          echo "BINANCE FUTURES PRICE ACTION SCANNER"
          echo "=========================================="

          echo "Exchange: Binance USD-M Futures"
          echo "Data Provider: CoinAPI"
          echo "Timeframe: 5m CLOSED"
          echo "TOP: 30"

          echo "Tenkan: 9"
          echo "Kijun: 26"

          echo "Box: 26 candles"
          echo "Swing: 2 + 2"

          echo "TP: 50% Box"
          echo "Max Open: 1"

          echo "=========================================="

          if [ -z "$COINAPI_KEY" ]; then
            echo "ERROR: COINAPI_KEY is not configured."
            echo "Please add COINAPI_KEY to GitHub Secrets."
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is not configured."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is not configured."
            exit 1
          fi

          echo "Required secrets detected."

          echo "=========================================="
          echo "STARTING SCANNER"
          echo "=========================================="

          set -o pipefail

          python -u scanner.py 2>&1 | tee scanner_output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "=========================================="
          echo "SCANNER EXIT CODE: $EXIT_CODE"
          echo "=========================================="

          exit $EXIT_CODE


      # ============================================================
      # SHOW ERROR LOG
      # ============================================================

      - name: Show Scanner Log On Failure
        if: failure()
        run: |

          echo "=========================================="
          echo "FULL SCANNER ERROR LOG"
          echo "=========================================="

          if [ -f scanner_output.log ]; then
            cat scanner_output.log
          else
            echo "scanner_output.log was not created."
          fi

          echo "=========================================="

          ls -la


      # ============================================================
      # SAVE LOG / STATE AS ARTIFACT
      # ============================================================

      - name: Save Scanner Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-scanner-log
          path: |
            scanner_output.log
            binance_price_action_state.json
            binance_price_action_trade_history.json
          if-no-files-found: ignore


      # ============================================================
      # SAVE STATE TO GITHUB
      # ============================================================

      - name: Save Scanner State
        if: always()
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            binance_price_action_state.json \
            binance_price_action_trade_history.json \
            || true

          if git diff --cached --quiet; then

            echo "No state changes to commit."

          else

            git commit \
              -m "Update Binance futures scanner state"

            git push

          fi
