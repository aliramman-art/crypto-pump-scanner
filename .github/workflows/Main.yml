name: Kraken Futures Ichimoku Scanner

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

# ============================================================
# PREVENT OVERLAPPING RUNS
# ============================================================

concurrency:
  group: kraken-futures-ichimoku-scanner
  cancel-in-progress: true


jobs:

  scanner:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ========================================================
      # INSTALL DEPENDENCIES
      # ========================================================

      - name: Install Dependencies
        run: |

          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          python -m pip install --upgrade pip

          pip install requests

          python -c "import requests; print('requests OK:', requests.__version__)"

          echo "=========================================="


      # ========================================================
      # CHECK SCANNER
      # ========================================================

      - name: Check Scanner
        run: |

          echo "=========================================="
          echo "CHECKING KRAKEN ICHIMOKU SCANNER"
          echo "=========================================="

          echo "Working directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -la

          echo ""
          echo "Checking scanner.py..."

          if [ ! -f scanner.py ]; then

            echo "ERROR: scanner.py not found."

            exit 1

          fi

          python -m py_compile scanner.py

          echo "scanner.py syntax OK."

          echo ""
          echo "Checking state files..."

          if [ -f ichimoku_state.json ]; then

            echo "State file FOUND:"

            ls -lh ichimoku_state.json

          else

            echo "State file NOT FOUND."

          fi


          if [ -f ichimoku_trade_history.json ]; then

            echo "Trade history FOUND:"

            ls -lh ichimoku_trade_history.json

          else

            echo "Trade history NOT FOUND."

          fi


          echo ""
          echo "=========================================="
          echo "CHECK COMPLETE"
          echo "=========================================="


      # ========================================================
      # CHECK SECRETS
      # ========================================================

      - name: Check Secrets

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          echo "=========================================="
          echo "CHECKING REQUIRED SECRETS"
          echo "=========================================="


          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then

            echo "ERROR: TELEGRAM_BOT_TOKEN is not configured."

            exit 1

          fi


          if [ -z "$TELEGRAM_CHAT_ID" ]; then

            echo "ERROR: TELEGRAM_CHAT_ID is not configured."

            exit 1

          fi


          echo "TELEGRAM_BOT_TOKEN: OK"

          echo "TELEGRAM_CHAT_ID: OK"

          echo "No CoinAPI key required."

          echo "No Binance API key required."


          echo "=========================================="
          echo "SECRETS CHECK OK"
          echo "=========================================="


      # ========================================================
      # RUN SCANNER
      # ========================================================

      - name: Run Kraken Ichimoku Scanner

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PYTHONUNBUFFERED: "1"

        run: |

          echo "============================================================"
          echo "KRAKEN FUTURES ICHIMOKU SCANNER"
          echo "============================================================"

          echo "Exchange: Kraken Futures"

          echo "Data Source: Kraken Futures API"

          echo "Timeframe: 5m CLOSED"

          echo "Trend: 1H"

          echo "Confirmation: 30m"

          echo "Pullback: 15m"

          echo "Trigger: 5m"

          echo "TOP: 100"

          echo "Tenkan: 9"

          echo "Kijun: 26"

          echo "Senkou B: 52"

          echo "Displacement: 26"

          echo "Max Open: 4"

          echo "Max Long: 2"

          echo "Max Short: 2"

          echo "Minimum Risk: 0.50%"

          echo "Risk/Reward: 1:1"

          echo "Timeout: 4 hours"

          echo "============================================================"

          echo "STARTING SCANNER"

          echo "============================================================"


          set -o pipefail

          python -u scanner.py 2>&1 | tee scanner_output.log

          EXIT_CODE=${PIPESTATUS[0]}


          echo "============================================================"

          echo "SCANNER EXIT CODE: $EXIT_CODE"

          echo "============================================================"


          exit $EXIT_CODE


      # ========================================================
      # SHOW LOG ON FAILURE
      # ========================================================

      - name: Show Scanner Log On Failure

        if: failure()

        run: |

          echo "============================================================"

          echo "FULL KRAKEN SCANNER ERROR LOG"

          echo "============================================================"


          if [ -f scanner_output.log ]; then

            cat scanner_output.log

          else

            echo "scanner_output.log was not created."

          fi


          echo ""

          echo "============================================================"

          echo "REPOSITORY FILES"

          echo "============================================================"


          ls -la


      # ========================================================
      # VERIFY STATE
      # ========================================================

      - name: Verify Scanner State

        if: always()

        run: |

          echo "============================================================"

          echo "STATE AFTER SCANNER"

          echo "============================================================"


          if [ -f ichimoku_state.json ]; then

            echo "STATE FILE:"

            ls -lh ichimoku_state.json

            echo "------------------------------------------------------------"

            cat ichimoku_state.json

          else

            echo "WARNING: ichimoku_state.json does not exist."

          fi


          echo ""

          echo "============================================================"


          if [ -f ichimoku_trade_history.json ]; then

            echo "TRADE HISTORY:"

            ls -lh ichimoku_trade_history.json

            echo "------------------------------------------------------------"

            cat ichimoku_trade_history.json

          else

            echo "WARNING: ichimoku_trade_history.json does not exist."

          fi


          echo ""

          echo "============================================================"


      # ========================================================
      # SAVE LOG + STATE AS ARTIFACT
      # ========================================================

      - name: Save Kraken Scanner Artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: kraken-ichimoku-scanner-${{ github.run_number }}

          path: |

            scanner_output.log

            ichimoku_state.json

            ichimoku_trade_history.json

          if-no-files-found: ignore

          retention-days: 7


      # ========================================================
      # SAVE STATE TO GITHUB
      # ========================================================

      - name: Save Scanner State

        if: always()

        run: |

          echo "============================================================"

          echo "SAVING KRAKEN SCANNER STATE"

          echo "============================================================"


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          echo ""

          echo "Current branch:"

          git branch --show-current


          echo ""

          echo "Repository status BEFORE commit:"

          git status --short


          echo ""

          echo "Adding state files..."


          # ------------------------------------------------------
          # ADD STATE
          # ------------------------------------------------------

          if [ -f ichimoku_state.json ]; then

            git add ichimoku_state.json

            echo "Added ichimoku_state.json"

          fi


          # ------------------------------------------------------
          # ADD HISTORY
          # ------------------------------------------------------

          if [ -f ichimoku_trade_history.json ]; then

            git add ichimoku_trade_history.json

            echo "Added ichimoku_trade_history.json"

          fi


          echo ""

          echo "Repository status AFTER git add:"

          git status --short


          echo ""

          echo "============================================================"

          echo "COMMIT CHECK"

          echo "============================================================"


          if git diff --cached --quiet; then

            echo "No state changes to commit."

          else

            echo "State changes detected."


            git commit \
              -m "Update Kraken Ichimoku scanner state [skip ci]"


            echo "State committed."


            echo ""

            echo "Pushing state to GitHub..."


            git push


            echo "State successfully pushed to GitHub."

          fi


          echo ""

          echo "============================================================"

          echo "STATE SAVE COMPLETE"

          echo "============================================================"
