name: Tenkan-Kijun Distance Backtest

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy


      # ======================================================
      # RUN BACKTEST
      # ======================================================

      - name: Run Tenkan-Kijun Backtest
        run: |
          python tenkan_kijun_backtest.py


      # ======================================================
      # UPLOAD TRADE HISTORY
      # ======================================================

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenkan-kijun-backtest-results
          path: |
            tenkan_kijun_backtest.csv
          if-no-files-found: ignore
