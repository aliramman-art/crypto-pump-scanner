name: Crypto Price Action Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: price-action-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALL
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests


      # ============================================================
      # CHECK STATE FILES
      # ============================================================
      - name: Check scanner files
        run: |
          echo "=========================================="
          echo "CRYPTO PRICE ACTION SCANNER"
          echo "=========================================="

          pwd
          ls -la

          echo "=========================================="
          echo "PRICE ACTION STATE FILES"
          echo "=========================================="

          if [ -f price_action_state.json ]; then
            echo "price_action_state.json FOUND"
            cat price_action_state.json
          else
            echo "price_action_state.json NOT FOUND"
          fi

          echo ""

          if [ -f price_action_trade_history.json ]; then
            echo "price_action_trade_history.json FOUND"
            cat price_action_trade_history.json
          else
            echo "price_action_trade_history.json NOT FOUND"
          fi


      # ============================================================
      # RUN SCANNER
      # ============================================================
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scanner.py


      # ============================================================
      # SHOW UPDATED STATE
      # ============================================================
      - name: Show updated scanner state
        if: always()
        run: |
          echo "=========================================="
          echo "UPDATED PRICE ACTION STATE"
          echo "=========================================="

          if [ -f price_action_state.json ]; then
            cat price_action_state.json
          else
            echo "price_action_state.json NOT FOUND"
          fi

          echo ""
          echo "=========================================="
          echo "UPDATED TRADE HISTORY"
          echo "=========================================="

          if [ -f price_action_trade_history.json ]; then
            cat price_action_trade_history.json
          else
            echo "price_action_trade_history.json NOT FOUND"
          fi


      # ============================================================
      # SAVE STATE
      # ============================================================
      - name: Save scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=========================================="
          echo "GIT STATUS"
          echo "=========================================="

          git status --short

          # IMPORTANT:
          # scanner.py uses these exact files
          git add \
            price_action_state.json \
            price_action_trade_history.json

          echo "=========================================="
          echo "STAGED CHANGES"
          echo "=========================================="

          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update price action scanner state"
            git push
          fi


      # ============================================================
      # FINISH
      # ============================================================
      - name: Finish
        if: always()
        run: |
          echo "=========================================="
          echo "PRICE ACTION SCANNER FINISHED"
          echo "=========================================="
