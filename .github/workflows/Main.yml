name: Kraken Futures Ichimoku Scanner

on:

  schedule:

    - cron: "*/5 * * * *"

  workflow_dispatch:


permissions:
  contents: write


# ============================================================
# PREVENT OVERLAPPING RUNS
# ============================================================

concurrency:

  group: kraken-futures-ichimoku-scanner

  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  scanner:

    runs-on: ubuntu-latest

    timeout-minutes: 15


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          persist-credentials: true


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

          cache: "pip"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install Dependencies

        run: |

          echo "============================================================"
          echo "INSTALLING DEPENDENCIES"
          echo "============================================================"

          python -m pip install --upgrade pip

          pip install requests

          echo ""
          echo "Requests version:"

          python -c "import requests; print(requests.__version__)"

          echo ""
          echo "Python version:"

          python --version

          echo ""
          echo "============================================================"
          echo "DEPENDENCIES READY"
          echo "============================================================"


      # ======================================================
      # CHECK SCANNER
      # ======================================================

      - name: Check Scanner

        run: |

          echo "============================================================"
          echo "CHECKING KRAKEN ICHIMOKU SCANNER"
          echo "============================================================"

          echo ""
          echo "Working directory:"

          pwd

          echo ""
          echo "Repository files:"

          ls -lah

          echo ""
          echo "------------------------------------------------------------"
          echo "CHECKING scanner.py"
          echo "------------------------------------------------------------"

          if [ ! -f scanner.py ]; then

            echo "ERROR: scanner.py not found."

            exit 1

          fi

          echo "scanner.py FOUND."

          echo ""
          echo "Python syntax check:"

          python -m py_compile scanner.py

          echo "scanner.py syntax OK."

          echo ""
          echo "------------------------------------------------------------"
          echo "CHECKING TELEGRAM OFFSET"
          echo "------------------------------------------------------------"

          if [ -f telegram_update_offset.json ]; then

            echo "Telegram offset FOUND:"

            cat telegram_update_offset.json

          else

            echo "Telegram offset NOT FOUND."

            echo "It will be created by scanner.py."

          fi

          echo ""
          echo "------------------------------------------------------------"
          echo "CHECKING STATE"
          echo "------------------------------------------------------------"

          if [ -f ichimoku_state.json ]; then

            echo "State file FOUND:"

            ls -lh ichimoku_state.json

          else

            echo "State file NOT FOUND."

          fi

          echo ""
          echo "------------------------------------------------------------"
          echo "CHECKING HISTORY"
          echo "------------------------------------------------------------"

          if [ -f ichimoku_trade_history.json ]; then

            echo "Trade history FOUND:"

            ls -lh ichimoku_trade_history.json

          else

            echo "Trade history NOT FOUND."

          fi

          echo ""
          echo "============================================================"
          echo "SCANNER CHECK COMPLETE"
          echo "============================================================"


      # ======================================================
      # TELEGRAM SECRETS
      # ======================================================

      - name: Check Telegram Secrets

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          echo "============================================================"
          echo "CHECKING TELEGRAM CONFIGURATION"
          echo "============================================================"

          echo ""
          echo "Checking TELEGRAM_BOT_TOKEN..."

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then

            echo "ERROR: TELEGRAM_BOT_TOKEN is NOT configured."

            exit 1

          fi

          echo "TELEGRAM_BOT_TOKEN: OK"


          echo ""
          echo "Checking TELEGRAM_CHAT_ID..."

          if [ -z "$TELEGRAM_CHAT_ID" ]; then

            echo "ERROR: TELEGRAM_CHAT_ID is NOT configured."

            exit 1

          fi

          echo "TELEGRAM_CHAT_ID: OK"


          echo ""
          echo "============================================================"
          echo "TELEGRAM SECRETS CHECK OK"
          echo "============================================================"


      # ======================================================
      # RUN SCANNER
      # ======================================================

      - name: Run Kraken Ichimoku Scanner

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PYTHONUNBUFFERED: "1"

        run: |

          echo "============================================================"
          echo "KRAKEN FUTURES ICHIMOKU SCANNER"
          echo "============================================================"

          echo ""
          echo "System:"
          echo "GitHub Actions"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Exchange:"
          echo "Kraken Futures"

          echo ""
          echo "Data Source:"
          echo "Kraken Futures API"

          echo ""
          echo "Strategy:"
          echo "Ichimoku MTF v14.1"

          echo ""
          echo "Timeframe:"
          echo "5m CLOSED"

          echo ""
          echo "Trend:"
          echo "1H"

          echo ""
          echo "Confirmation / Lock:"
          echo "30m"

          echo ""
          echo "Pullback Structure:"
          echo "15m"

          echo ""
          echo "Trigger:"
          echo "5m"

          echo ""
          echo "Markets:"
          echo "TOP 100 USD Perpetual"

          echo ""
          echo "Ichimoku:"
          echo "Tenkan: 9"
          echo "Kijun: 26"
          echo "Senkou B: 52"
          echo "Displacement: 26"

          echo ""
          echo "Risk Management:"
          echo "Maximum Open Trades: 4"
          echo "Maximum Long: 2"
          echo "Maximum Short: 2"

          echo ""
          echo "Stop Loss:"
          echo "Minimum: 0.50%"
          echo "Maximum: 2.00%"

          echo ""
          echo "Risk / Reward:"
          echo "1:1"

          echo ""
          echo "Trade Timeout:"
          echo "4 hours"

          echo ""
          echo "Telegram:"
          echo "ENABLED"

          echo ""
          echo "Telegram Commands:"
          echo "/check ETH"
          echo "/check BTC"
          echo "/check BTC ETH SOL XRP"

          echo ""
          echo "============================================================"
          echo "STARTING SCANNER"
          echo "============================================================"

          echo ""

          set -o pipefail

          python -u scanner.py 2>&1 | tee scanner_output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""

          echo "============================================================"
          echo "SCANNER FINISHED"
          echo "============================================================"

          echo ""
          echo "SCANNER EXIT CODE: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 0 ]; then

            echo "Scanner completed successfully."

          else

            echo "WARNING: Scanner exited with error code $EXIT_CODE."

          fi

          echo ""
          echo "============================================================"

          exit $EXIT_CODE


      # ======================================================
      # FAILURE LOG
      # ======================================================

      - name: Show Scanner Log On Failure

        if: failure()

        run: |

          echo "============================================================"
          echo "FULL KRAKEN SCANNER ERROR LOG"
          echo "============================================================"

          if [ -f scanner_output.log ]; then

            echo ""
            echo "scanner_output.log:"
            echo "------------------------------------------------------------"

            cat scanner_output.log

          else

            echo "WARNING: scanner_output.log was not created."

          fi

          echo ""
          echo "============================================================"


      # ======================================================
      # VERIFY STATE
      # ======================================================

      - name: Verify Scanner State

        if: always()

        run: |

          echo "============================================================"
          echo "STATE AFTER SCANNER"
          echo "============================================================"

          echo ""
          echo "------------------------------------------------------------"
          echo "TELEGRAM OFFSET"
          echo "------------------------------------------------------------"

          if [ -f telegram_update_offset.json ]; then

            echo "telegram_update_offset.json FOUND"

            cat telegram_update_offset.json

          else

            echo "telegram_update_offset.json NOT FOUND"

          fi


          echo ""
          echo "------------------------------------------------------------"
          echo "ICHIMOKU STATE"
          echo "------------------------------------------------------------"

          if [ -f ichimoku_state.json ]; then

            echo "STATE FILE FOUND:"

            ls -lh ichimoku_state.json

          else

            echo "ichimoku_state.json NOT FOUND"

          fi


          echo ""
          echo "------------------------------------------------------------"
          echo "TRADE HISTORY"
          echo "------------------------------------------------------------"

          if [ -f ichimoku_trade_history.json ]; then

            echo "TRADE HISTORY FOUND:"

            ls -lh ichimoku_trade_history.json

          else

            echo "ichimoku_trade_history.json NOT FOUND"

          fi


          echo ""
          echo "============================================================"
          echo "STATE VERIFICATION COMPLETE"
          echo "============================================================"


      # ======================================================
      # ARTIFACTS
      # ======================================================

      - name: Save Kraken Scanner Artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: kraken-ichimoku-scanner-${{ github.run_number }}

          path: |

            scanner_output.log

            ichimoku_state.json

            ichimoku_trade_history.json

            telegram_update_offset.json

          if-no-files-found: ignore

          retention-days: 7


      # ======================================================
      # SAVE STATE TO GITHUB
      # ======================================================

      - name: Save Scanner State

        if: always()

        run: |

          echo "============================================================"
          echo "SAVING KRAKEN SCANNER STATE TO GITHUB"
          echo "============================================================"


          # ----------------------------------------------------
          # GIT CONFIG
          # ----------------------------------------------------

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          echo ""
          echo "Current branch:"

          git branch --show-current


          echo ""
          echo "Repository status BEFORE commit:"

          git status --short


          # ----------------------------------------------------
          # ADD STATE
          # ----------------------------------------------------

          if [ -f ichimoku_state.json ]; then

            git add ichimoku_state.json

            echo "Added ichimoku_state.json"

          fi


          # ----------------------------------------------------
          # ADD HISTORY
          # ----------------------------------------------------

          if [ -f ichimoku_trade_history.json ]; then

            git add ichimoku_trade_history.json

            echo "Added ichimoku_trade_history.json"

          fi


          # ----------------------------------------------------
          # ADD TELEGRAM OFFSET
          # ----------------------------------------------------

          if [ -f telegram_update_offset.json ]; then

            git add telegram_update_offset.json

            echo "Added telegram_update_offset.json"

          fi


          echo ""
          echo "Repository status AFTER git add:"

          git status --short


          # ----------------------------------------------------
          # COMMIT
          # ----------------------------------------------------

          if git diff --cached --quiet; then

            echo ""
            echo "No state changes to commit."

          else

            echo ""
            echo "State changes detected."

            git commit \
              -m "Update Kraken Ichimoku scanner state [skip ci]"

            echo ""
            echo "Commit created."


            # ------------------------------------------------
            # PUSH
            # ------------------------------------------------

            PUSH_SUCCESS=false

            for ATTEMPT in 1 2 3
            do

              echo ""
              echo "Git push attempt: $ATTEMPT / 3"

              if git push; then

                echo ""
                echo "Git push SUCCESSFUL."

                PUSH_SUCCESS=true

                break

              else

                echo ""
                echo "Git push failed."

                if [ "$ATTEMPT" -lt 3 ]; then

                  echo "Waiting before retry..."

                  sleep $((ATTEMPT * 3))

                fi

              fi

            done


            if [ "$PUSH_SUCCESS" = false ]; then

              echo ""
              echo "ERROR: Failed to push scanner state."

              exit 1

            fi

          fi


          echo ""
          echo "============================================================"
          echo "STATE SAVE COMPLETE"
          echo "============================================================"


      # ======================================================
      # FINAL SUMMARY
      # ======================================================

      - name: Workflow Summary

        if: always()

        run: |

          echo "============================================================"
          echo "KRAKEN ICHIMOKU WORKFLOW SUMMARY"
          echo "============================================================"

          echo ""
          echo "Workflow:"
          echo "${{ github.workflow }}"

          echo ""
          echo "Run Number:"
          echo "${{ github.run_number }}"

          echo ""
          echo "Run ID:"
          echo "${{ github.run_id }}"

          echo ""
          echo "Commit:"
          echo "${{ github.sha }}"

          echo ""
          echo "Scanner:"
          echo "Kraken Futures Ichimoku v14.1"

          echo ""
          echo "Telegram:"
          echo "Enabled"

          echo ""
          echo "Telegram Offset:"
          if [ -f telegram_update_offset.json ]; then
            echo "telegram_update_offset.json FOUND"
          else
            echo "telegram_update_offset.json NOT FOUND"
          fi

          echo ""
          echo "State:"
          if [ -f ichimoku_state.json ]; then
            echo "ichimoku_state.json FOUND"
          else
            echo "ichimoku_state.json NOT FOUND"
          fi

          echo ""
          echo "History:"
          if [ -f ichimoku_trade_history.json ]; then
            echo "ichimoku_trade_history.json FOUND"
          else
            echo "ichimoku_trade_history.json NOT FOUND"
          fi

          echo ""
          echo "Scanner Log:"
          if [ -f scanner_output.log ]; then
            echo "scanner_output.log FOUND"
          else
            echo "scanner_output.log NOT FOUND"
          fi

          echo ""
          echo "============================================================"
          echo "WORKFLOW FINISHED"
          echo "============================================================"
