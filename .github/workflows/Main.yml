name: VOLUME-KHAT 100

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Check scanner exists
        run: |
          test -f scanner.py
          echo "scanner.py FOUND."

      - name: Check Python syntax
        run: |
          python -m py_compile scanner.py
          echo "Python syntax OK."

      - name: Run VOLUME-KHAT 100
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "VOLUME-KHAT 100"
          echo "============================================================"

          echo "SYSTEM: GitHub Actions"
          echo "EXCHANGE: Kraken Futures"
          echo "MARKETS: TOP 100 USD PERPETUAL"

          echo "============================================================"
          echo "STARTING SCANNER"
          echo "============================================================"

          python scanner.py

          echo "============================================================"
          echo "SCANNER FINISHED"
          echo "============================================================"
