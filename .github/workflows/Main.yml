name: Crypto UT Bot Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. Install packages
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      # ==========================================
      # 4. Check files
      # ==========================================

      - name: Check files
        run: |
          echo "======================================"
          echo "CHECKING PROJECT"
          echo "======================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Workflows:"
          ls -la .github/workflows || true

          echo ""

          if [ ! -f scanner.py ]; then
            echo "ERROR: scanner.py NOT FOUND"
            exit 1
          fi

          echo "OK: scanner.py FOUND"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "CCXT:"
          python -c "import ccxt; print(ccxt.__version__)"

          echo ""
          echo "Pandas:"
          python -c "import pandas; print(pandas.__version__)"

          echo ""
          echo "NumPy:"
          python -c "import numpy; print(numpy.__version__)"

          echo ""
          echo "Requests:"
          python -c "import requests; print(requests.__version__)"

      # ==========================================
      # 5. Telegram test
      # ==========================================

      - name: Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          echo "======================================"
          echo "TELEGRAM TEST"
          echo "======================================"

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is empty"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is empty"
            exit 1
          fi

          RESPONSE=$(curl -sS \
            --max-time 20 \
            --get \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=🧪 Crypto UT Bot Scanner - Telegram test OK" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")

          echo ""
          echo "Telegram response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo ""
            echo "TELEGRAM: OK"
          else
            echo ""
            echo "TELEGRAM: FAILED"
            exit 1
          fi

      # ==========================================
      # 6. Run scanner
      # ==========================================

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"

        run: |

          echo "======================================"
          echo "STARTING SCANNER"
          echo "======================================"

          echo ""
          echo "UTC time:"
          date -u

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Scanner file:"
          ls -lh scanner.py

          echo ""
          echo "Running scanner.py ..."
          echo ""

          python -u scanner.py

          EXIT_CODE=$?

          echo ""
          echo "======================================"
          echo "SCANNER EXIT CODE: $EXIT_CODE"
          echo "======================================"

          exit $EXIT_CODE

      # ==========================================
      # 7. Finish
      # ==========================================

      - name: Finish
        if: always()
        run: |

          echo "======================================"
          echo "WORKFLOW FINISHED"
          echo "======================================"

          date -u

          echo ""
          echo "Git status:"
          git status --short
