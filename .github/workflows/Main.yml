name: Binance Futures Price Action Scanner

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-futures-price-action-scanner
  cancel-in-progress: false

jobs:

  scanner:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

          python -c "import requests; print('requests OK:', requests.__version__)"


      # ============================================================
      # CHECK FILES
      # ============================================================

      - name: Check Scanner
        run: |
          echo "=========================================="
          echo "CHECKING SCANNER"
          echo "=========================================="

          pwd
          ls -la

          test -f scanner.py

          python -m py_compile scanner.py

          echo "scanner.py syntax OK"

          echo "=========================================="
          echo "CHECKING PERSISTENT STATE"
          echo "=========================================="

          if [ -f binance_price_action_state.json ]; then
            echo "State file FOUND:"
            ls -lh binance_price_action_state.json
          else
            echo "State file NOT FOUND."
            echo "This is the first run or the file has not been created yet."
          fi

          if [ -f binance_price_action_trade_history.json ]; then
            echo "Trade history FOUND:"
            ls -lh binance_price_action_trade_history.json
          else
            echo "Trade history NOT FOUND."
            echo "This is the first run or the file has not been created yet."
          fi


      # ============================================================
      # RUN SCANNER
      # ============================================================

      - name: Run Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          COINAPI_KEY: ${{ secrets.COINAPI_KEY }}

          PYTHONUNBUFFERED: "1"

        run: |

          echo "=========================================="
          echo "BINANCE FUTURES PRICE ACTION SCANNER"
          echo "=========================================="

          echo "Exchange: Binance USD-M Futures"
          echo "Data Provider: CoinAPI"
          echo "Timeframe: 5m CLOSED"
          echo "TOP: 30"

          echo "Tenkan: 9"
          echo "Kijun: 26"

          echo "Box: 26 candles"
          echo "Swing: 2 + 2"

          echo "TP: 50% Box"
          echo "Max Open: 1"

          echo "=========================================="

          if [ -z "$COINAPI_KEY" ]; then
            echo "ERROR: COINAPI_KEY is not configured."
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is not configured."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is not configured."
            exit 1
          fi

          echo "Required secrets detected."

          echo "=========================================="
          echo "STARTING SCANNER"
          echo "=========================================="

          set -o pipefail

          python -u scanner.py 2>&1 | tee scanner_output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "=========================================="
          echo "SCANNER EXIT CODE: $EXIT_CODE"
          echo "=========================================="

          exit $EXIT_CODE


      # ============================================================
      # SHOW ERROR LOG
      # ============================================================

      - name: Show Scanner Log On Failure
        if: failure()
        run: |

          echo "=========================================="
          echo "FULL SCANNER ERROR LOG"
          echo "=========================================="

          if [ -f scanner_output.log ]; then
            cat scanner_output.log
          else
            echo "scanner_output.log was not created."
          fi

          echo "=========================================="

          ls -la


      # ============================================================
      # SHOW STATE AFTER SCANNER
      # ============================================================

      - name: Verify Scanner State
        if: always()
        run: |

          echo "=========================================="
          echo "STATE AFTER SCANNER"
          echo "=========================================="

          if [ -f binance_price_action_state.json ]; then
            echo "STATE FILE:"
            ls -lh binance_price_action_state.json
            echo "------------------------------------------"
            cat binance_price_action_state.json
          else
            echo "WARNING: State file does not exist."
          fi

          echo "=========================================="

          if [ -f binance_price_action_trade_history.json ]; then
            echo "TRADE HISTORY:"
            ls -lh binance_price_action_trade_history.json
            echo "------------------------------------------"
            cat binance_price_action_trade_history.json
          else
            echo "WARNING: Trade history file does not exist."
          fi

          echo "=========================================="


      # ============================================================
      # SAVE LOG / STATE AS ARTIFACT
      # ============================================================

      - name: Save Scanner Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-scanner-log-${{ github.run_number }}
          path: |
            scanner_output.log
            binance_price_action_state.json
            binance_price_action_trade_history.json
          if-no-files-found: ignore
          retention-days: 7


      # ============================================================
      # SAVE STATE TO GITHUB
      # ============================================================

      - name: Save Scanner State
        if: always()
        run: |

          echo "=========================================="
          echo "SAVING SCANNER STATE"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Current branch:"
          git branch --show-current

          echo "Repository status BEFORE commit:"
          git status --short

          # --------------------------------------------------------
          # Add state/history files
          # --------------------------------------------------------

          if [ -f binance_price_action_state.json ]; then
            git add binance_price_action_state.json
          fi

          if [ -f binance_price_action_trade_history.json ]; then
            git add binance_price_action_trade_history.json
          fi

          echo "Repository status AFTER git add:"
          git status --short

          # --------------------------------------------------------
          # Commit changes
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            echo "No state changes to commit."

          else

            git commit \
              -m "Update Binance futures scanner state [skip ci]"

            echo "State committed."

            # ------------------------------------------------------
            # Push changes
            # ------------------------------------------------------

            git push

            echo "State successfully pushed to GitHub."

          fi

          echo "=========================================="
          echo "STATE SAVE COMPLETE"
          echo "=========================================="
