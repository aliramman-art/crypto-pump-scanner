name: VOLUME-KHAT 100

on:

  # ============================================================
  # RUN EVERY 5 MINUTES
  # ============================================================

  schedule:
    - cron: "*/5 * * * *"

  # ============================================================
  # MANUAL RUN
  # ============================================================

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write


# ============================================================
# PREVENT OVERLAPPING SCANS
# ============================================================

concurrency:

  group: volume-khat-100

  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  scanner:

    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          persist-credentials: true


      # ========================================================
      # SETUP PYTHON
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ========================================================
      # INSTALL DEPENDENCIES
      # ========================================================

      - name: Install Dependencies

        run: |

          set -e

          echo "============================================================"
          echo "VOLUME-KHAT 100"
          echo "INSTALLING DEPENDENCIES"
          echo "============================================================"

          python -m pip install --upgrade pip

          pip install requests pandas numpy

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Requests:"
          python -c "import requests; print(requests.__version__)"

          echo ""
          echo "Pandas:"
          python -c "import pandas; print(pandas.__version__)"

          echo ""
          echo "NumPy:"
          python -c "import numpy; print(numpy.__version__)"

          echo ""
          echo "============================================================"
          echo "DEPENDENCIES READY"
          echo "============================================================"


      # ========================================================
      # CHECK FILES
      # ========================================================

      - name: Check Scanner

        run: |

          set -e

          echo "============================================================"
          echo "CHECKING VOLUME-KHAT 100"
          echo "============================================================"

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -lah

          echo ""
          echo "Checking scanner.py..."

          if [ ! -f scanner.py ]; then

            echo ""
            echo "ERROR: scanner.py NOT FOUND."
            echo ""

            exit 1

          fi

          echo "scanner.py FOUND."

          echo ""
          echo "Checking Python syntax..."

          python -m py_compile scanner.py

          echo ""
          echo "scanner.py syntax OK."

          echo ""
          echo "============================================================"
          echo "SCANNER CHECK COMPLETE"
          echo "============================================================"


      # ========================================================
      # CHECK TELEGRAM SECRETS
      # ========================================================

      - name: Check Telegram Configuration

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          set -e

          echo "============================================================"
          echo "TELEGRAM CONFIGURATION"
          echo "============================================================"

          echo ""
          echo "Checking TELEGRAM_BOT_TOKEN..."

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then

            echo "ERROR: TELEGRAM_BOT_TOKEN is missing."

            exit 1

          fi

          echo "TELEGRAM_BOT_TOKEN: OK"


          echo ""
          echo "Checking TELEGRAM_CHAT_ID..."

          if [ -z "$TELEGRAM_CHAT_ID" ]; then

            echo "ERROR: TELEGRAM_CHAT_ID is missing."

            exit 1

          fi

          echo "TELEGRAM_CHAT_ID: OK"


          echo ""
          echo "============================================================"
          echo "TELEGRAM CONFIGURATION OK"
          echo "============================================================"


      # ========================================================
      # RUN VOLUME-KHAT 100
      # ========================================================

      - name: Run Volume-Khat 100 Scanner

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PYTHONUNBUFFERED: "1"

        run: |

          set -o pipefail

          echo "============================================================"
          echo "VOLUME-KHAT 100"
          echo "============================================================"

          echo ""
          echo "SYSTEM: GitHub Actions"

          echo "EXCHANGE: Kraken Futures"

          echo "MARKETS: TOP 100 USD PERPETUAL"

          echo ""

          echo "============================================================"
          echo "STRATEGY"
          echo "============================================================"

          echo ""
          echo "1H  = Trend + Static Support/Resistance"

          echo "15M = Dynamic Support/Resistance + RVOL + Setup"

          echo "5M  = Entry Confirmation"

          echo ""

          echo "============================================================"
          echo "VOLUME"
          echo "============================================================"

          echo ""
          echo "RVOL baseline: 20 candles"

          echo "Abnormal Volume: RVOL >= 2.0"

          echo "Strong Volume: RVOL >= 3.0"

          echo ""

          echo "============================================================"
          echo "SETUPS"
          echo "============================================================"

          echo ""
          echo "BREAKOUT"

          echo "HIGH-VOLUME REJECTION"

          echo ""

          echo "============================================================"
          echo "RISK MANAGEMENT"
          echo "============================================================"

          echo ""
          echo "Minimum RR: 1:2"

          echo "Static S/R: 1H + 15M"

          echo "Dynamic S/R: 15M"

          echo "SL: Structural + ATR buffer"

          echo "TP: Next valid static S/R"

          echo ""

          echo "============================================================"
          echo "STARTING SCANNER"
          echo "============================================================"

          echo ""

          python -u scanner.py 2>&1 | tee scanner_output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""

          echo "============================================================"
          echo "SCANNER EXIT CODE: $EXIT_CODE"
          echo "============================================================"

          exit $EXIT_CODE


      # ========================================================
      # SHOW LOG
      # ========================================================

      - name: Show Scanner Log

        if: always()

        run: |

          echo "============================================================"
          echo "SCANNER LOG"
          echo "============================================================"

          if [ -f scanner_output.log ]; then

            cat scanner_output.log

          else

            echo "scanner_output.log was not created."

          fi

          echo ""
          echo "============================================================"


      # ========================================================
      # SHOW DATABASE
      # ========================================================

      - name: Check Database

        if: always()

        run: |

          echo "============================================================"
          echo "VOLUME-KHAT DATABASE"
          echo "============================================================"

          if [ -f volume_khat_100.db ]; then

            echo ""
            echo "Database FOUND."

            ls -lh volume_khat_100.db

          else

            echo ""
            echo "Database not found."

          fi

          echo ""
          echo "============================================================"


      # ========================================================
      # UPLOAD ARTIFACTS
      # ========================================================

      - name: Upload Scanner Artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: volume-khat-100-${{ github.run_number }}

          path: |

            scanner_output.log

            volume_khat_100.db

            *.json

          if-no-files-found: ignore

          retention-days: 7


      # ========================================================
      # SAVE DATABASE AND STATE
      # ========================================================

      - name: Save Scanner State

        if: always()

        run: |

          echo "============================================================"
          echo "SAVING VOLUME-KHAT 100 STATE"
          echo "============================================================"

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          echo ""
          echo "Repository status BEFORE commit:"

          git status --short


          # ======================================================
          # ADD DATABASE
          # ======================================================

          if [ -f volume_khat_100.db ]; then

            git add volume_khat_100.db

            echo "Added volume_khat_100.db"

          fi


          # ======================================================
          # ADD JSON STATE FILES
          # ======================================================

          for FILE in *.json
          do

            if [ -f "$FILE" ]; then

              git add "$FILE"

              echo "Added $FILE"

            fi

          done


          echo ""
          echo "Repository status AFTER git add:"

          git status --short


          # ======================================================
          # COMMIT
          # ======================================================

          if git diff --cached --quiet; then

            echo ""
            echo "No state changes to commit."

          else

            echo ""
            echo "State changes detected."

            git commit \
              -m "Update Volume-Khat 100 scanner state [skip ci]"


            echo ""
            echo "Commit created."


            # ==================================================
            # PUSH
            # ==================================================

            PUSH_SUCCESS=false


            for ATTEMPT in 1 2 3
            do

              echo ""
              echo "Git push attempt $ATTEMPT / 3"

              if git push; then

                echo ""
                echo "Git push SUCCESSFUL."

                PUSH_SUCCESS=true

                break

              else

                echo ""
                echo "Git push FAILED."

                if [ "$ATTEMPT" -lt 3 ]; then

                  sleep $((ATTEMPT * 3))

                fi

              fi

            done


            if [ "$PUSH_SUCCESS" = false ]; then

              echo ""
              echo "ERROR: Could not push scanner state."

              exit 1

            fi

          fi


          echo ""
          echo "============================================================"
          echo "STATE SAVE COMPLETE"
          echo "============================================================"


      # ========================================================
      # FINAL SUMMARY
      # ========================================================

      - name: Final Summary

        if: always()

        run: |

          echo "============================================================"
          echo "VOLUME-KHAT 100"
          echo "FINAL SUMMARY"
          echo "============================================================"

          echo ""
          echo "Workflow:"
          echo "${{ github.workflow }}"

          echo ""
          echo "Run:"
          echo "${{ github.run_number }}"

          echo ""
          echo "Commit:"
          echo "${{ github.sha }}"

          echo ""
          echo "Strategy:"
          echo "VOLUME-KHAT 100"

          echo ""
          echo "Markets:"
          echo "TOP 100 USD PERPETUAL"

          echo ""
          echo "1H:"
          echo "Trend + Static S/R"

          echo ""
          echo "15M:"
          echo "Dynamic S/R + RVOL + Setup"

          echo ""
          echo "5M:"
          echo "Entry Confirmation"

          echo ""
          echo "Minimum RVOL:"
          echo "2.0"

          echo ""
          echo "Minimum RR:"
          echo "1:2"

          echo ""
          echo "Scanner Log:"

          if [ -f scanner_output.log ]; then
            echo "FOUND"
          else
            echo "NOT FOUND"
          fi

          echo ""
          echo "Database:"

          if [ -f volume_khat_100.db ]; then
            echo "FOUND"
          else
            echo "NOT FOUND"
          fi

          echo ""
          echo "============================================================"
          echo "WORKFLOW FINISHED"
          echo "============================================================"
