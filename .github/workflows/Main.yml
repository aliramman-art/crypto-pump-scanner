name: Crypto UT Bot Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ut-bot-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests


      # ============================================================
      # SHOW FILES
      # ============================================================
      - name: Check scanner files
        run: |
          echo "=========================================="
          echo "Repository:"
          pwd
          echo "=========================================="

          ls -la

          echo "=========================================="
          echo "State files:"
          echo "=========================================="

          ls -la \
            ut_bot_state.json \
            ut_bot_trade_history.json \
            ut_bot_reset_done.txt \
            2>/dev/null || true


      # ============================================================
      # RUN ONE COMPLETE SCAN
      # ============================================================
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scanner.py


      # ============================================================
      # SAVE STATE / HISTORY
      # ============================================================
      - name: Save scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=========================================="
          echo "Git status:"
          echo "=========================================="

          git status --short

          git add \
            ut_bot_state.json \
            ut_bot_trade_history.json \
            ut_bot_reset_done.txt \
            2>/dev/null || true

          echo "=========================================="
          echo "Changes to commit:"
          echo "=========================================="

          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update UT Bot scanner state"
            git push
          fi


      # ============================================================
      # FINISH
      # ============================================================
      - name: Finish
        if: always()
        run: |
          echo "=========================================="
          echo "UT Bot Scanner workflow finished."
          echo "=========================================="
