name: Kraken Backtest Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "===== FILES ====="
          pwd
          ls -la
          echo "===== PY FILES ====="
          find . -maxdepth 2 -type f -name "*.py" -print

      - name: Python version
        run: |
          echo "===== PYTHON ====="
          python --version
          python3 --version

      - name: Install requests
        run: |
          echo "===== INSTALL ====="
          python -m pip install requests

      - name: Check backtest.py exists
        run: |
          echo "===== CHECK FILE ====="

          if [ -f "backtest.py" ]; then
            echo "backtest.py EXISTS"
            wc -l backtest.py
            head -n 5 backtest.py
          else
            echo "ERROR: backtest.py NOT FOUND"
            exit 1
          fi

      - name: Syntax check
        run: |
          echo "===== SYNTAX CHECK ====="
          python -m py_compile backtest.py
          echo "SYNTAX OK"

      - name: Test Python execution
        run: |
          echo "===== PYTHON EXECUTION ====="
          python -c "print('PYTHON WORKS')"

      - name: Test Kraken connection
        run: |
          echo "===== KRAKEN CONNECTION ====="

          python - <<'PY'
          import requests

          url = "https://futures.kraken.com"

          print("Connecting to:", url)

          r = requests.get(
              url,
              timeout=20
          )

          print("HTTP STATUS:", r.status_code)
          print("RESPONSE LENGTH:", len(r.text))

          r.raise_for_status()

          print("KRAKEN CONNECTION OK")
          PY

      - name: Test backtest import
        run: |
          echo "===== IMPORT TEST ====="
          python -c "import backtest; print('BACKTEST IMPORT OK')"

      - name: Start backtest
        run: |
          echo "===== START BACKTEST ====="
          python -u backtest.py
