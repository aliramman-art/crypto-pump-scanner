name: Kraken Ichimoku Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Stage 1
        run: |
          echo "=========================================="
          echo "KRAKEN ICHIMOKU BACKTEST - STAGE 1"
          echo "=========================================="
          python -u backtest.py
