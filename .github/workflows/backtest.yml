name: Kraken Ichimoku Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install requests

      - name: Verify files
        run: |
          echo "===== VERIFY ====="
          pwd
          echo "----- FILES -----"
          ls -la
          echo "----- BACKTEST -----"
          ls -lh backtest.py
          echo "----- PYTHON -----"
          python --version
          echo "===== VERIFY DONE ====="

      - name: Run backtest
        continue-on-error: true
        run: |
          echo "===== START BACKTEST ====="

          python -u backtest.py > backtest.log 2>&1

          CODE=$?

          echo "===== PYTHON EXIT CODE: $CODE ====="

          echo "===== BACKTEST LOG ====="
          cat backtest.log || true
          echo "===== END BACKTEST LOG ====="

          exit 0

      - name: Upload backtest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-debug-log
          path: backtest.log
          if-no-files-found: warn

      - name: Show final status
        if: always()
        run: |
          echo "=========================================="
          echo "BACKTEST DEBUG RUN FINISHED"
          echo "=========================================="
