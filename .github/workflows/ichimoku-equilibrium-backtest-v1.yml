name: ICHIMOKU EQUILIBRIUM v1.0 - 1Y BACKTEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  backtest:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      # ======================================================
      # RUN 1 YEAR BACKTEST
      # ======================================================

      - name: Run ICHIMOKU EQUILIBRIUM 1Y Backtest
        run: |
          python ichimoku_equilibrium_backtest_v1.py

      # ======================================================
      # UPLOAD RESULTS
      # ======================================================

      - name: Upload Backtest Results
        uses: actions/upload-artifact@v4
        with:
          name: ichimoku-equilibrium-v1-1y-backtest
          path: |
            doge_ichimoku_equilibrium_12m_trades.csv
            doge_ichimoku_equilibrium_12m_equity.csv
            doge_ichimoku_equilibrium_12m_report.txt
          if-no-files-found: error
