name: ICHIMOKU EQUILIBRIUM v3.0 - DOGE 12M BACKTEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  backtest:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      # ======================================================
      # RUN BACKTEST
      # ======================================================

      - name: Run Ichimoku Equilibrium v3
        run: |
          python ichimoku_equilibrium_v3.py

      # ======================================================
      # CHECK OUTPUT FILES
      # ======================================================

      - name: Check generated files
        if: always()
        run: |
          echo "=============================================="
          echo "ICHIMOKU EQUILIBRIUM OUTPUT FILES"
          echo "=============================================="

          echo ""
          echo "Trades:"
          if [ -f doge_ichimoku_equilibrium_12m_trades.csv ]; then
            ls -lh doge_ichimoku_equilibrium_12m_trades.csv
          else
            echo "MISSING: doge_ichimoku_equilibrium_12m_trades.csv"
          fi

          echo ""
          echo "Equity:"
          if [ -f doge_ichimoku_equilibrium_12m_equity.csv ]; then
            ls -lh doge_ichimoku_equilibrium_12m_equity.csv
          else
            echo "MISSING: doge_ichimoku_equilibrium_12m_equity.csv"
          fi

          echo ""
          echo "Report:"
          if [ -f doge_ichimoku_equilibrium_12m_report.txt ]; then
            ls -lh doge_ichimoku_equilibrium_12m_report.txt
          else
            echo "MISSING: doge_ichimoku_equilibrium_12m_report.txt"
          fi

          echo ""
          echo "=============================================="
          echo "REPORT"
          echo "=============================================="

          if [ -f doge_ichimoku_equilibrium_12m_report.txt ]; then
            cat doge_ichimoku_equilibrium_12m_report.txt
          fi

      # ======================================================
      # UPLOAD BACKTEST RESULTS
      # ======================================================

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ichimoku-equilibrium-v3-doge-12m
          path: |
            doge_ichimoku_equilibrium_12m_trades.csv
            doge_ichimoku_equilibrium_12m_equity.csv
            doge_ichimoku_equilibrium_12m_report.txt
          if-no-files-found: error
