name: ICHIMOKU EQUILIBRIUM v3.0 - DOGE 12M BACKTEST

on:
  workflow_dispatch:

concurrency:
  group: ichimoku-equilibrium-v3-doge
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  backtest:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      # ======================================================
      # RUN ORIGINAL V3 BACKTEST
      # ======================================================

      - name: Run v3 backtest
        run: |
          python ichimoku_equilibrium_v3.py

      # ======================================================
      # VERIFY OUTPUT
      # ======================================================

      - name: Verify backtest files
        run: |
          echo "=============================================="
          echo "CHECKING V3 OUTPUT FILES"
          echo "=============================================="

          test -f doge_ichimoku_equilibrium_12m_trades.csv
          test -f doge_ichimoku_equilibrium_12m_equity.csv
          test -f doge_ichimoku_equilibrium_12m_report.txt

          echo ""
          echo "✓ trades CSV found"
          echo "✓ equity CSV found"
          echo "✓ report TXT found"

          echo ""
          echo "File sizes:"
          ls -lh \
            doge_ichimoku_equilibrium_12m_trades.csv \
            doge_ichimoku_equilibrium_12m_equity.csv \
            doge_ichimoku_equilibrium_12m_report.txt

      # ======================================================
      # PRINT ORIGINAL REPORT
      # ======================================================

      - name: Print original v3 report
        run: |
          echo ""
          echo "######################################################################"
          echo "# ORIGINAL V3 BACKTEST REPORT"
          echo "######################################################################"
          cat doge_ichimoku_equilibrium_12m_report.txt
          echo "######################################################################"

      # ======================================================
      # DEEP TRADE ANALYSIS
      # EVERYTHING IS PRINTED DIRECTLY INTO RUN LOG
      # ======================================================

      - name: Deep analysis of 625 trades
        run: |

          python - <<'PY'

          import pandas as pd
          import numpy as np

          FILE = "doge_ichimoku_equilibrium_12m_trades.csv"

          df = pd.read_csv(FILE)

          # ==========================================================
          # HELPERS
          # ==========================================================

          def section(title):
              print("")
              print("")
              print("=" * 78)
              print(title)
              print("=" * 78)

          def pct(x):
              if pd.isna(x):
                  return "N/A"
              return f"{x:.3f}%"

          def num(x):
              if pd.isna(x):
                  return "N/A"
              if np.isinf(x):
                  return "INF"
              return f"{x:.3f}"

          def find_col(names):

              for name in names:
                  if name in df.columns:
                      return name

              return None

          # ==========================================================
          # COLUMN DETECTION
          # ==========================================================

          side_col = find_col([
              "side",
              "Side",
              "direction",
              "Direction"
          ])

          pnl_col = find_col([
              "pnl_pct",
              "PnL_Pct",
              "pnl",
              "PnL",
              "return_pct",
              "Return",
              "return"
          ])

          result_col = find_col([
              "exit_reason",
              "Exit Reason",
              "exit",
              "Exit",
              "result",
              "Result"
          ])

          entry_col = find_col([
              "entry",
              "Entry",
              "entry_price",
              "Entry Price"
          ])

          rr_col = find_col([
              "rr",
              "RR",
              "risk_reward",
              "Risk Reward"
          ])

          eqdist_col = find_col([
              "equilibrium_distance",
              "equilibrium_distance_pct",
              "eq_distance",
              "eq_distance_pct",
              "eq_dist"
          ])

          atr_col = find_col([
              "atr",
              "ATR",
              "atr_pct",
              "ATR_pct"
          ])

          date_col = find_col([
              "entry_time",
              "Entry Time",
              "entry_datetime",
              "datetime",
              "date",
              "timestamp"
          ])

          # ==========================================================
          # HEADER
          # ==========================================================

          section("ICHIMOKU EQUILIBRIUM v3.0 - DEEP TRADE ANALYSIS")

          print(f"Total rows: {len(df)}")

          print("")
          print("Detected columns:")
          print(f"  SIDE       : {side_col}")
          print(f"  PNL        : {pnl_col}")
          print(f"  EXIT       : {result_col}")
          print(f"  ENTRY      : {entry_col}")
          print(f"  RR         : {rr_col}")
          print(f"  EQUILIBRIUM: {eqdist_col}")
          print(f"  ATR        : {atr_col}")
          print(f"  DATE       : {date_col}")

          # ==========================================================
          # RAW DATA SAMPLE
          # ==========================================================

          section("FIRST 10 TRADES")

          print(
              df.head(10).to_string(index=False)
          )

          section("LAST 10 TRADES")

          print(
              df.tail(10).to_string(index=False)
          )

          # ==========================================================
          # OVERALL PERFORMANCE
          # ==========================================================

          if pnl_col:

              df[pnl_col] = pd.to_numeric(
                  df[pnl_col],
                  errors="coerce"
              )

              pnl = df[pnl_col].dropna()

              wins = pnl[pnl > 0]
              losses = pnl[pnl < 0]

              gross_profit = wins.sum()
              gross_loss = abs(losses.sum())

              pf = (
                  gross_profit / gross_loss
                  if gross_loss > 0
                  else np.inf
              )

              section("OVERALL TRADE STATISTICS")

              print(f"Trades          : {len(pnl)}")
              print(f"Wins            : {len(wins)}")
              print(f"Losses          : {len(losses)}")
              print(f"Win Rate        : {pct(len(wins) / len(pnl) * 100)}")
              print(f"Profit Factor   : {num(pf)}")
              print(f"Net PnL         : {pct(pnl.sum())}")
              print(f"Average Trade   : {pct(pnl.mean())}")
              print(f"Median Trade    : {pct(pnl.median())}")

              if len(wins):
                  print(f"Average Winner  : {pct(wins.mean())}")
                  print(f"Median Winner   : {pct(wins.median())}")
                  print(f"Best Trade      : {pct(wins.max())}")

              if len(losses):
                  print(f"Average Loser   : {pct(losses.mean())}")
                  print(f"Median Loser    : {pct(losses.median())}")
                  print(f"Worst Trade     : {pct(losses.min())}")

          # ==========================================================
          # LONG VS SHORT
          # ==========================================================

          if side_col and pnl_col:

              section("LONG vs SHORT ANALYSIS")

              sides = df[side_col].dropna().unique()

              for side in sides:

                  x = df[df[side_col] == side].copy()

                  p = pd.to_numeric(
                      x[pnl_col],
                      errors="coerce"
                  ).dropna()

                  wins = p[p > 0]
                  losses = p[p < 0]

                  gross_profit = wins.sum()
                  gross_loss = abs(losses.sum())

                  pf = (
                      gross_profit / gross_loss
                      if gross_loss > 0
                      else np.inf
                  )

                  print("")
                  print(f"----- {str(side).upper()} -----")
                  print(f"Trades          : {len(p)}")
                  print(f"Wins            : {len(wins)}")
                  print(f"Losses          : {len(losses)}")
                  print(f"Win Rate        : {pct(len(wins) / len(p) * 100)}")
                  print(f"Profit Factor   : {num(pf)}")
                  print(f"Net PnL         : {pct(p.sum())}")
                  print(f"Average Trade   : {pct(p.mean())}")

                  if len(wins):
                      print(f"Average Winner  : {pct(wins.mean())}")

                  if len(losses):
                      print(f"Average Loser   : {pct(losses.mean())}")

          # ==========================================================
          # EXIT TYPE
          # ==========================================================

          if result_col and pnl_col:

              section("EXIT TYPE ANALYSIS")

              results = df[result_col].dropna().unique()

              for result in results:

                  x = df[df[result_col] == result]

                  p = pd.to_numeric(
                      x[pnl_col],
                      errors="coerce"
                  ).dropna()

                  wins = p[p > 0]

                  print("")
                  print(f"----- {result} -----")
                  print(f"Trades          : {len(p)}")
                  print(f"Positive        : {len(wins)}")
                  print(f"Negative        : {len(p[p <= 0])}")
                  print(f"Win Rate        : {pct(len(wins) / len(p) * 100) if len(p) else 0}")
                  print(f"Net PnL         : {pct(p.sum())}")
                  print(f"Average PnL     : {pct(p.mean())}")

          # ==========================================================
          # RR BUCKETS
          # ==========================================================

          if rr_col and pnl_col:

              section("RR BUCKET ANALYSIS")

              temp = df.copy()

              temp[rr_col] = pd.to_numeric(
                  temp[rr_col],
                  errors="coerce"
              )

              temp[pnl_col] = pd.to_numeric(
                  temp[pnl_col],
                  errors="coerce"
              )

              bins = [
                  -np.inf,
                  1.25,
                  1.50,
                  1.75,
                  2.00,
                  2.50,
                  3.00,
                  4.00,
                  np.inf
              ]

              labels = [
                  "<=1.25",
                  "1.25-1.50",
                  "1.50-1.75",
                  "1.75-2.00",
                  "2.00-2.50",
                  "2.50-3.00",
                  "3.00-4.00",
                  ">4.00"
              ]

              temp["RR_BUCKET"] = pd.cut(
                  temp[rr_col],
                  bins=bins,
                  labels=labels
              )

              for bucket, x in temp.groupby(
                  "RR_BUCKET",
                  observed=False
              ):

                  p = x[pnl_col].dropna()

                  if len(p) == 0:
                      continue

                  wins = p[p > 0]
                  losses = p[p < 0]

                  gp = wins.sum()
                  gl = abs(losses.sum())

                  pf = gp / gl if gl > 0 else np.inf

                  print("")
                  print(f"----- RR {bucket} -----")
                  print(f"Trades          : {len(p)}")
                  print(f"Win Rate        : {pct(len(wins) / len(p) * 100)}")
                  print(f"Profit Factor   : {num(pf)}")
                  print(f"Net PnL         : {pct(p.sum())}")
                  print(f"Average Trade   : {pct(p.mean())}")

          # ==========================================================
          # EQUILIBRIUM DISTANCE
          # ==========================================================

          if eqdist_col and pnl_col:

              section("EQUILIBRIUM DISTANCE ANALYSIS")

              temp = df.copy()

              temp[eqdist_col] = pd.to_numeric(
                  temp[eqdist_col],
                  errors="coerce"
              )

              temp[pnl_col] = pd.to_numeric(
                  temp[pnl_col],
                  errors="coerce"
              )

              bins = [
                  -np.inf,
                  0.50,
                  0.75,
                  1.00,
                  1.25,
                  1.50,
                  1.75,
                  2.00,
                  np.inf
              ]

              labels = [
                  "<0.50",
                  "0.50-0.75",
                  "0.75-1.00",
                  "1.00-1.25",
                  "1.25-1.50",
                  "1.50-1.75",
                  "1.75-2.00",
                  ">2.00"
              ]

              temp["EQ_BUCKET"] = pd.cut(
                  temp[eqdist_col],
                  bins=bins,
                  labels=labels
              )

              for bucket, x in temp.groupby(
                  "EQ_BUCKET",
                  observed=False
              ):

                  p = x[pnl_col].dropna()

                  if len(p) == 0:
                      continue

                  wins = p[p > 0]
                  losses = p[p < 0]

                  gp = wins.sum()
                  gl = abs(losses.sum())

                  pf = gp / gl if gl > 0 else np.inf

                  print("")
                  print(f"----- Equilibrium Distance {bucket} -----")
                  print(f"Trades          : {len(p)}")
                  print(f"Win Rate        : {pct(len(wins) / len(p) * 100)}")
                  print(f"Profit Factor   : {num(pf)}")
                  print(f"Net PnL         : {pct(p.sum())}")
                  print(f"Average Trade   : {pct(p.mean())}")

          # ==========================================================
          # ATR BUCKETS
          # ==========================================================

          if atr_col and pnl_col:

              section("ATR ANALYSIS")

              temp = df.copy()

              temp[atr_col] = pd.to_numeric(
                  temp[atr_col],
                  errors="coerce"
              )

              temp[pnl_col] = pd.to_numeric(
                  temp[pnl_col],
                  errors="coerce"
              )

              try:

                  temp["ATR_BUCKET"] = pd.qcut(
                      temp[atr_col],
                      5,
                      duplicates="drop"
                  )

                  for bucket, x in temp.groupby(
                      "ATR_BUCKET",
                      observed=False
                  ):

                      p = x[pnl_col].dropna()

                      if len(p) == 0:
                          continue

                      wins = p[p > 0]
                      losses = p[p < 0]

                      gp = wins.sum()
                      gl = abs(losses.sum())

                      pf = gp / gl if gl > 0 else np.inf

                      print("")
                      print(f"----- ATR {bucket} -----")
                      print(f"Trades          : {len(p)}")
                      print(f"Win Rate        : {pct(len(wins) / len(p) * 100)}")
                      print(f"Profit Factor   : {num(pf)}")
                      print(f"Net PnL         : {pct(p.sum())}")
                      print(f"Average Trade   : {pct(p.mean())}")

              except Exception as e:

                  print("")
                  print(f"ATR analysis error: {e}")

          # ==========================================================
          # MONTHLY PERFORMANCE
          # ==========================================================

          if date_col and pnl_col:

              section("MONTHLY PERFORMANCE")

              temp = df.copy()

              temp[date_col] = pd.to_datetime(
                  temp[date_col],
                  errors="coerce"
              )

              temp[pnl_col] = pd.to_numeric(
                  temp[pnl_col],
                  errors="coerce"
              )

              temp["MONTH"] = temp[date_col].dt.strftime("%Y-%m")

              for month, x in temp.groupby("MONTH"):

                  if pd.isna(month):
                      continue

                  p = x[pnl_col].dropna()

                  if len(p) == 0:
                      continue

                  wins = p[p > 0]
                  losses = p[p < 0]

                  gp = wins.sum()
                  gl = abs(losses.sum())

                  pf = gp / gl if gl > 0 else np.inf

                  print("")
                  print(f"----- {month} -----")
                  print(f"Trades          : {len(p)}")
                  print(f"Win Rate        : {pct(len(wins) / len(p) * 100)}")
                  print(f"Profit Factor   : {num(pf)}")
                  print(f"Net PnL         : {pct(p.sum())}")
                  print(f"Average Trade   : {pct(p.mean())}")

          # ==========================================================
          # WIN / LOSS SIZE
          # ==========================================================

          if pnl_col:

              section("WINNER / LOSER SIZE")

              p = pd.to_numeric(
                  df[pnl_col],
                  errors="coerce"
              ).dropna()

              wins = p[p > 0]
              losses = p[p < 0]

              print(f"Winning trades   : {len(wins)}")
              print(f"Losing trades    : {len(losses)}")

              if len(wins):

                  print(f"Avg winner       : {pct(wins.mean())}")
                  print(f"Median winner    : {pct(wins.median())}")
                  print(f"Best winner      : {pct(wins.max())}")

              if len(losses):

                  print(f"Avg loser        : {pct(losses.mean())}")
                  print(f"Median loser     : {pct(losses.median())}")
                  print(f"Worst loser      : {pct(losses.min())}")

          # ==========================================================
          # TOP 20 LOSERS
          # ==========================================================

          if pnl_col:

              section("TOP 20 LOSING TRADES")

              temp = df.copy()

              temp[pnl_col] = pd.to_numeric(
                  temp[pnl_col],
                  errors="coerce"
              )

              print(
                  temp.sort_values(
                      pnl_col,
                      ascending=True
                  ).head(20).to_string(index=False)
              )

          # ==========================================================
          # TOP 20 WINNERS
          # ==========================================================

          if pnl_col:

              section("TOP 20 WINNING TRADES")

              print(
                  temp.sort_values(
                      pnl_col,
                      ascending=False
                  ).head(20).to_string(index=False)
              )

          # ==========================================================
          # ALL COLUMN STATISTICS
          # ==========================================================

          section("AVAILABLE DATA COLUMNS")

          for col in df.columns:

              print("")
              print(f"--- {col} ---")

              try:
                  print(
                      df[col].describe(
                          include="all"
                      ).to_string()
                  )
              except Exception:
                  print(
                      df[col]
                      .value_counts()
                      .head(20)
                      .to_string()
                  )

          # ==========================================================
          # END
          # ==========================================================

          section("END OF V3 DEEP ANALYSIS")

          print("All analysis was generated directly from:")
          print(FILE)

          print("")
          print("NO TRADING PARAMETERS WERE CHANGED.")
          print("NO BACKTEST LOGIC WAS CHANGED.")
          print("THIS STEP ONLY ANALYZES THE EXISTING V3 TRADES.")

          PY

      # ======================================================
      # UPLOAD ORIGINAL BACKTEST FILES
      # ======================================================

      - name: Upload v3 backtest files
        uses: actions/upload-artifact@v4
        with:
          name: ichimoku-equilibrium-v3-doge-12m
          path: |
            doge_ichimoku_equilibrium_12m_trades.csv
            doge_ichimoku_equilibrium_12m_equity.csv
            doge_ichimoku_equilibrium_12m_report.txt
          if-no-files-found: error
