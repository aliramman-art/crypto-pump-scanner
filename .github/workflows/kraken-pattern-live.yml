name: Kraken Futures Trendline Live Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: kraken-trendline-live
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib

      # ============================================================
      # CHECK DATABASE
      # ============================================================
      - name: Check persistent database
        run: |
          echo "=============================================="
          echo "CHECKING PERSISTENT DATABASE"
          echo "=============================================="

          if [ -f "trendline_1h_breakout_v30.db" ]; then

            echo "Database FOUND:"
            ls -lh trendline_1h_breakout_v30.db

            python - <<'PY'
          import sqlite3

          db = "trendline_1h_breakout_v30.db"

          conn = sqlite3.connect(db)

          tables = conn.execute("""
              SELECT name
              FROM sqlite_master
              WHERE type='table'
          """).fetchall()

          print("Tables:", [x[0] for x in tables])

          if any(x[0] == "signals" for x in tables):

              total = conn.execute(
                  "SELECT COUNT(*) FROM signals"
              ).fetchone()[0]

              open_trades = conn.execute(
                  "SELECT COUNT(*) FROM signals WHERE status='OPEN'"
              ).fetchone()[0]

              closed_trades = conn.execute(
                  "SELECT COUNT(*) FROM signals WHERE status='CLOSED'"
              ).fetchone()[0]

              print("Total signals:", total)
              print("Open trades:", open_trades)
              print("Closed trades:", closed_trades)

          conn.close()
          PY

          else

            echo "Database NOT FOUND."
            echo "First run will create trendline_1h_breakout_v30.db."

          fi

      # ============================================================
      # VERIFY TELEGRAM SECRETS
      # ============================================================
      - name: Verify Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=============================================="
          echo "TELEGRAM SECRET CHECK"
          echo "=============================================="

          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "[TELEGRAM] Bot token: FOUND"
          else
            echo "[TELEGRAM] Bot token: NOT FOUND"
          fi

          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "[TELEGRAM] Chat ID: FOUND"
          else
            echo "[TELEGRAM] Chat ID: NOT FOUND"
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo ""
            echo "::error::Telegram secrets are not available."
            echo "::error::Required secret names:"
            echo "::error::TELEGRAM_BOT_TOKEN"
            echo "::error::TELEGRAM_CHAT_ID"
            exit 1
          fi

          echo ""
          echo "[TELEGRAM] Configuration: COMPLETE"

      # ============================================================
      # RUN SCANNER
      # ============================================================
      - name: Run Trendline Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=============================================="
          echo "STARTING KRAKEN FUTURES TRENDLINE SCANNER"
          echo "=============================================="

          python kraken_pattern_live.py

      # ============================================================
      # FINALIZE SQLITE
      # ============================================================
      - name: Finalize SQLite database
        if: always()
        run: |

          if [ -f "trendline_1h_breakout_v30.db" ]; then

            echo "Finalizing SQLite database..."

            python - <<'PY'
          import sqlite3

          db = "trendline_1h_breakout_v30.db"

          conn = sqlite3.connect(db)

          try:
              conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              print("SQLite WAL checkpoint completed.")
          except Exception as e:
              print("SQLite WAL checkpoint warning:", e)

          conn.commit()
          conn.close()
          PY

          else

            echo "Database file not found during finalization."

          fi

      # ============================================================
      # CHECK DATABASE AFTER SCAN
      # ============================================================
      - name: Check database after scan
        if: always()
        run: |

          echo "=============================================="
          echo "DATABASE STATUS AFTER SCAN"
          echo "=============================================="

          if [ -f "trendline_1h_breakout_v30.db" ]; then

            ls -lh trendline_1h_breakout_v30.db

            python - <<'PY'
          import sqlite3

          db = "trendline_1h_breakout_v30.db"

          conn = sqlite3.connect(db)

          total = conn.execute(
              "SELECT COUNT(*) FROM signals"
          ).fetchone()[0]

          open_trades = conn.execute(
              "SELECT COUNT(*) FROM signals WHERE status='OPEN'"
          ).fetchone()[0]

          closed_trades = conn.execute(
              "SELECT COUNT(*) FROM signals WHERE status='CLOSED'"
          ).fetchone()[0]

          pnl = conn.execute(
              """
              SELECT COALESCE(SUM(pnl_percent), 0)
              FROM signals
              WHERE status='CLOSED'
              """
          ).fetchone()[0]

          print("Total signals:", total)
          print("Open trades:", open_trades)
          print("Closed trades:", closed_trades)
          print("Closed PnL:", pnl)

          conn.close()
          PY

          else

            echo "::error::trendline_1h_breakout_v30.db was not created."
            exit 1

          fi

      # ============================================================
      # PERSIST DATABASE
      # ============================================================
      - name: Persist SQLite database
        if: always()
        run: |

          if [ ! -f "trendline_1h_breakout_v30.db" ]; then

            echo "::error::Database file missing."
            exit 1

          fi

          echo "=============================================="
          echo "PERSISTING DATABASE"
          echo "=============================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trendline_1h_breakout_v30.db

          if git diff --cached --quiet; then

            echo "No database changes to commit."

          else

            git commit -m "Persist trendline scanner database [skip ci]"
            git push

            echo "Database successfully persisted."

          fi

      # ============================================================
      # FINAL STATUS
      # ============================================================
      - name: Final status
        if: always()
        run: |

          echo "=============================================="
          echo "WORKFLOW FINISHED"
          echo "=============================================="

          if [ -f "trendline_1h_breakout_v30.db" ]; then
            echo "Database: trendline_1h_breakout_v30.db"
            ls -lh trendline_1h_breakout_v30.db
          else
            echo "Database: NOT FOUND"
          fi
