name: Kraken Futures Trendline Live Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: kraken-trendline-live
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # =========================================================
      # CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =========================================================
      # SETUP PYTHON
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib

      # =========================================================
      # SHOW FILES / DATABASE BEFORE SCAN
      # =========================================================
      - name: Diagnose persistent database
        run: |
          echo "=================================================="
          echo "REPOSITORY / DATABASE DIAGNOSTIC"
          echo "=================================================="

          echo ""
          echo "CURRENT DIRECTORY:"
          pwd

          echo ""
          echo "DATABASE FILES:"
          find . -maxdepth 3 -type f \
            \( -name "*.db" -o -name "*.sqlite" -o -name "*.sqlite3" \) \
            -print -exec ls -lh {} \; || true

          echo ""
          echo "TARGET DATABASE:"
          if [ -f "kraken_pattern_live_v52.db" ]; then
            echo "FOUND: kraken_pattern_live_v52.db"
            ls -lh kraken_pattern_live_v52.db

            python - <<'PY'
          import sqlite3

          db = "kraken_pattern_live_v52.db"

          print("DB:", db)

          con = sqlite3.connect(db)

          try:
              tables = con.execute("""
                  SELECT name
                  FROM sqlite_master
                  WHERE type='table'
                  ORDER BY name
              """).fetchall()

              print("TABLES:")
              for row in tables:
                  print(" ", row[0])

              print("")
              print("ROW COUNTS:")

              for (table,) in tables:
                  try:
                      count = con.execute(
                          f'SELECT COUNT(*) FROM "{table}"'
                      ).fetchone()[0]

                      print(f"  {table}: {count}")
                  except Exception as e:
                      print(f"  {table}: ERROR {e}")

          finally:
              con.close()
          PY

          else
            echo "NOT FOUND: kraken_pattern_live_v52.db"
            echo "WARNING: Scanner may create a NEW database."
          fi

      # =========================================================
      # SHOW PYTHON DB CONFIGURATION
      # =========================================================
      - name: Check scanner DB configuration
        run: |
          echo "=================================================="
          echo "SCANNER DATABASE CONFIGURATION"
          echo "=================================================="

          if [ -f "kraken_pattern_live.py" ]; then
            echo "kraken_pattern_live.py FOUND"

            echo ""
            echo "VERSION / DB_FILE references:"
            grep -nE 'VERSION|DB_FILE|sqlite3\.connect' \
              kraken_pattern_live.py || true
          else
            echo "ERROR: kraken_pattern_live.py NOT FOUND"
            exit 1
          fi

      # =========================================================
      # RUN SCANNER
      # =========================================================
      - name: Run Trendline Scanner
        run: |
          python kraken_pattern_live.py

      # =========================================================
      # FINALIZE SQLITE
      # =========================================================
      - name: Finalize SQLite database
        if: success()
        run: |
          echo "=================================================="
          echo "FINALIZING SQLITE DATABASE"
          echo "=================================================="

          if [ -f "kraken_pattern_live_v52.db" ]; then

            python - <<'PY'
          import sqlite3

          db = "kraken_pattern_live_v52.db"

          con = sqlite3.connect(db)

          try:
              con.commit()

              try:
                  con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              except Exception as e:
                  print("WAL checkpoint:", e)

              con.commit()

          finally:
              con.close()

          print("SQLite database finalized.")
          PY

          else
            echo "ERROR: DB file missing after scanner."
            exit 1
          fi

      # =========================================================
      # VERIFY DATABASE AFTER SCAN
      # =========================================================
      - name: Verify database after scan
        if: success()
        run: |
          echo "=================================================="
          echo "DATABASE AFTER SCAN"
          echo "=================================================="

          if [ ! -f "kraken_pattern_live_v52.db" ]; then
            echo "ERROR: kraken_pattern_live_v52.db does not exist."
            exit 1
          fi

          ls -lh kraken_pattern_live_v52.db

          python - <<'PY'
          import sqlite3

          db = "kraken_pattern_live_v52.db"

          con = sqlite3.connect(db)

          try:
              tables = con.execute("""
                  SELECT name
                  FROM sqlite_master
                  WHERE type='table'
                  ORDER BY name
              """).fetchall()

              print("TABLES:")

              for (table,) in tables:
                  print(" ", table)

              print("")
              print("ROW COUNTS:")

              for (table,) in tables:
                  try:
                      count = con.execute(
                          f'SELECT COUNT(*) FROM "{table}"'
                      ).fetchone()[0]

                      print(f"  {table}: {count}")
                  except Exception as e:
                      print(f"  {table}: ERROR {e}")

          finally:
              con.close()
          PY

      # =========================================================
      # PERSIST DATABASE INTO REPOSITORY
      # =========================================================
      - name: Persist SQLite database
        if: success()
        run: |
          echo "=================================================="
          echo "PERSISTING DATABASE"
          echo "=================================================="

          if [ ! -f "kraken_pattern_live_v52.db" ]; then
            echo "ERROR: Database file not found."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kraken_pattern_live_v52.db

          if git diff --cached --quiet; then
            echo "No DB changes detected."
          else
            git commit -m "Persist trendline scanner database [skip ci]"
            git push

            echo "DATABASE COMMITTED AND PUSHED."
          fi

      # =========================================================
      # FINAL STATUS
      # =========================================================
      - name: Final status
        if: always()
        run: |
          echo "=================================================="
          echo "WORKFLOW FINAL STATUS"
          echo "=================================================="

          if [ -f "kraken_pattern_live_v52.db" ]; then
            echo "Persistent DB: PRESENT"
            ls -lh kraken_pattern_live_v52.db
          else
            echo "Persistent DB: MISSING"
          fi
