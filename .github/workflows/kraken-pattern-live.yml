name: Kraken Futures Trendline Live Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: kraken-trendline-live
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # =========================================================
      # CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =========================================================
      # SETUP PYTHON
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib

      # =========================================================
      # DATABASE BEFORE SCAN
      # =========================================================
      - name: Check persistent database
        run: |
          echo "=================================================="
          echo "DATABASE STATUS BEFORE SCAN"
          echo "=================================================="

          echo "Current directory:"
          pwd

          echo ""
          echo "Expected database:"
          echo "trendline_1h_breakout_v30.db"

          if [ -f "trendline_1h_breakout_v30.db" ]; then

            echo ""
            echo "DB FOUND"
            ls -lh trendline_1h_breakout_v30.db

            python - <<'PY'
          import sqlite3

          db = "trendline_1h_breakout_v30.db"

          con = sqlite3.connect(db)

          try:
              tables = con.execute("""
                  SELECT name
                  FROM sqlite_master
                  WHERE type='table'
                  ORDER BY name
              """).fetchall()

              print("Tables:")

              for table in tables:
                  print(" -", table[0])

              print("")
              print("Row counts:")

              for (table,) in tables:
                  try:
                      count = con.execute(
                          f'SELECT COUNT(*) FROM "{table}"'
                      ).fetchone()[0]

                      print(
                          f" - {table}: {count}"
                      )

                  except Exception as exc:
                      print(
                          f" - {table}: ERROR {exc}"
                      )

          finally:
              con.close()
          PY

          else

            echo ""
            echo "DB NOT FOUND"
            echo "A new database will be created by Python."

          fi

      # =========================================================
      # VERIFY PYTHON DATABASE CONFIG
      # =========================================================
      - name: Verify scanner database configuration
        run: |
          echo "=================================================="
          echo "PYTHON DATABASE CONFIGURATION"
          echo "=================================================="

          grep -nE 'VERSION|DB_FILE' \
            kraken_pattern_live.py || true

      # =========================================================
      # RUN SCANNER
      # =========================================================
      - name: Run Trendline Scanner
        run: |
          python kraken_pattern_live.py

      # =========================================================
      # SQLITE FINALIZE
      # =========================================================
      - name: Finalize SQLite database
        if: success()
        run: |

          echo "=================================================="
          echo "FINALIZING SQLITE DATABASE"
          echo "=================================================="

          if [ ! -f "trendline_1h_breakout_v30.db" ]; then

            echo "ERROR:"
            echo "trendline_1h_breakout_v30.db was not created."

            exit 1

          fi

          python - <<'PY'
          import sqlite3

          db = "trendline_1h_breakout_v30.db"

          con = sqlite3.connect(db)

          try:

              con.commit()

              try:
                  con.execute(
                      "PRAGMA wal_checkpoint(TRUNCATE)"
                  )
              except Exception as exc:
                  print(
                      "WAL checkpoint warning:",
                      exc
                  )

              con.commit()

          finally:
              con.close()

          print(
              "SQLite database finalized."
          )
          PY

      # =========================================================
      # VERIFY DATABASE AFTER SCAN
      # =========================================================
      - name: Verify database after scan
        if: success()
        run: |

          echo "=================================================="
          echo "DATABASE STATUS AFTER SCAN"
          echo "=================================================="

          if [ ! -f "trendline_1h_breakout_v30.db" ]; then

            echo "ERROR: Database missing."

            exit 1

          fi

          ls -lh trendline_1h_breakout_v30.db

          python - <<'PY'
          import sqlite3

          db = "trendline_1h_breakout_v30.db"

          con = sqlite3.connect(db)

          try:

              tables = con.execute("""
                  SELECT name
                  FROM sqlite_master
                  WHERE type='table'
                  ORDER BY name
              """).fetchall()

              print("Tables:")

              for table in tables:
                  print(" -", table[0])

              print("")
              print("Row counts:")

              for (table,) in tables:

                  try:

                      count = con.execute(
                          f'SELECT COUNT(*) FROM "{table}"'
                      ).fetchone()[0]

                      print(
                          f" - {table}: {count}"
                      )

                  except Exception as exc:

                      print(
                          f" - {table}: ERROR {exc}"
                      )

          finally:
              con.close()
          PY

      # =========================================================
      # PERSIST DATABASE INTO REPOSITORY
      # =========================================================
      - name: Persist SQLite database
        if: success()
        run: |

          echo "=================================================="
          echo "PERSISTING DATABASE"
          echo "=================================================="

          if [ ! -f "trendline_1h_breakout_v30.db" ]; then

            echo "ERROR: Database file not found."

            exit 1

          fi

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add trendline_1h_breakout_v30.db

          if git diff --cached --quiet; then

            echo "No database changes detected."

          else

            git commit \
              -m "Persist trendline scanner database [skip ci]"

            git push

            echo "DATABASE SUCCESSFULLY PERSISTED."

          fi

      # =========================================================
      # FINAL STATUS
      # =========================================================
      - name: Final status
        if: always()
        run: |

          echo "=================================================="
          echo "WORKFLOW FINAL STATUS"
          echo "=================================================="

          if [ -f "trendline_1h_breakout_v30.db" ]; then

            echo "Persistent DB: OK"

            ls -lh \
              trendline_1h_breakout_v30.db

          else

            echo "Persistent DB: MISSING"

          fi
