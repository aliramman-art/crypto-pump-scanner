name: Kraken Pattern Live Scanner

on:
  schedule:
    - cron: "*/1 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kraken-pattern-live
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy

      # ======================================================
      # RUN LIVE SCANNER
      # ======================================================

      - name: Run Kraken Pattern Live Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python kraken_pattern_live.py

      # ======================================================
      # SAVE DATABASE STATE
      # ======================================================

      - name: Save scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f "kraken_pattern_live_v52.db" ]; then
            echo "Database found:"
            ls -lh kraken_pattern_live_v52.db

            git add kraken_pattern_live_v52.db

            if git diff --cached --quiet; then
              echo "No database changes."
            else
              git commit -m "Update Kraken live scanner state"
              git push
            fi
          else
            echo "ERROR: kraken_pattern_live_v52.db was not created/found."
            exit 1
          fi
