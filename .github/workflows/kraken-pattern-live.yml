name: Kraken Pattern Live Scanner

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kraken-pattern-live
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy matplotlib

      # ======================================================
      # SHOW RUNNER PUBLIC IP
      # ======================================================

      - name: Show Runner Public IP
        run: |
          echo "Runner public IP:"
          curl -s https://api.ipify.org
          echo

      # ======================================================
      # RUN LIVE SCANNER
      # ======================================================

      - name: Run Kraken Pattern Live Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python kraken_pattern_live.py

      # ======================================================
      # SAVE DATABASE STATE
      # ======================================================

      - name: Save scanner state
        if: always()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f "kraken_pattern_live_v52.db" ]; then

            echo "Database found:"
            ls -lh kraken_pattern_live_v52.db

            git add kraken_pattern_live_v52.db

            if git diff --cached --quiet; then
              echo "No database changes."
              exit 0
            fi

            git commit -m "Update Kraken live scanner state"

            echo "Fetching latest remote main..."
            git fetch origin main

            echo "Rebasing local changes onto latest remote main..."
            git rebase origin/main

            echo "Pushing scanner state..."

            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                echo "Database state pushed successfully."
                exit 0
              fi

              echo "Push failed on attempt $attempt."

              if [ "$attempt" -lt 5 ]; then
                echo "Fetching latest remote main and retrying..."

                git fetch origin main

                git rebase origin/main
              fi
            done

            echo "ERROR: Failed to push database state after 5 attempts."
            exit 1

          else
            echo "ERROR: kraken_pattern_live_v52.db was not created/found."
            exit 1
          fi
