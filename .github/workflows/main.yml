name: Crypto UT Bot Scanner

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-utbot-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    # کمی بیشتر از 5 دقیقه برای نصب و اسکن 30 ارز
    timeout-minutes: 10

    steps:

      # =========================================================
      # 1. دریافت آخرین نسخه کد
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # 2. نصب Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # 3. نصب کتابخانه‌ها
      # =========================================================
      - name: Install dependencies
        run: |
          echo "========================================"
          echo "Installing Python dependencies..."
          echo "========================================"

          python --version
          python -m pip --version

          python -m pip install --upgrade pip

          echo "Installing requirements.txt..."
          python -m pip install -r requirements.txt

          echo "========================================"
          echo "Installed packages:"
          python -m pip list
          echo "========================================"

      # =========================================================
      # 4. بررسی وجود فایل‌های اصلی
      # =========================================================
      - name: Check scanner files
        run: |
          echo "========================================"
          echo "Repository files"
          echo "========================================"

          ls -la

          echo "----------------------------------------"

          if [ ! -f scanner.py ]; then
            echo "ERROR: scanner.py not found!"
            exit 1
          fi

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found!"
            exit 1
          fi

          echo "scanner.py       : OK"
          echo "requirements.txt : OK"

      # =========================================================
      # 5. اجرای Scanner
      # =========================================================
      - name: Run UT Bot scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================"
          echo "Starting Crypto UT Bot Scanner"
          echo "========================================"

          python scanner.py

          echo "========================================"
          echo "Scanner finished"
          echo "========================================"

      # =========================================================
      # 6. نمایش State و Trade History
      # =========================================================
      - name: Check scanner output
        run: |
          echo "========================================"
          echo "Scanner output files"
          echo "========================================"

          if [ -f utbot_state.json ]; then
            echo "utbot_state.json : FOUND"
            ls -lh utbot_state.json
          else
            echo "utbot_state.json : NOT FOUND"
          fi

          if [ -f utbot_trade_history.json ]; then
            echo "utbot_trade_history.json : FOUND"
            ls -lh utbot_trade_history.json
          else
            echo "utbot_trade_history.json : NOT FOUND"
          fi

      # =========================================================
      # 7. ذخیره State و Trade History در GitHub
      # =========================================================
      - name: Save scanner state and trade history
        run: |
          echo "========================================"
          echo "Saving scanner state..."
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update UT Bot scanner state and trade history"
            git push
          fi
