name: Crypto UT Bot Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      # ============================================================
      # CHECK FILES
      # ============================================================
      - name: Check scanner files
        run: |
          echo "======================================"
          echo "Repository files"
          echo "======================================"
          ls -la

          echo ""
          echo "======================================"
          echo "Python version"
          echo "======================================"
          python --version

          echo ""
          echo "======================================"
          echo "Checking scanner.py"
          echo "======================================"

          if [ ! -f scanner.py ]; then
            echo "ERROR: scanner.py not found!"
            exit 1
          fi

          echo "scanner.py found."

      # ============================================================
      # TELEGRAM CONFIGURATION
      # ============================================================
      - name: Check Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          echo "======================================"
          echo "Telegram configuration check"
          echo "======================================"

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is EMPTY"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is EMPTY"
            exit 1
          fi

          echo "TELEGRAM_BOT_TOKEN: OK"
          echo "TELEGRAM_CHAT_ID: OK"

      # ============================================================
      # TELEGRAM CONNECTION TEST
      # ============================================================
      - name: Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          echo "======================================"
          echo "Testing Telegram connection"
          echo "======================================"

          RESPONSE=$(curl -sS \
            --get \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=🧪 UT Bot Scanner - GitHub Actions connection test" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")

          echo "Telegram response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram connection: SUCCESS"
          else
            echo "Telegram connection: FAILED"
            exit 1
          fi

      # ============================================================
      # SHOW OLD STATE BEFORE SCAN
      # ============================================================
      - name: Show previous scanner state
        run: |
          echo "======================================"
          echo "Previous scanner state"
          echo "======================================"

          if [ -f utbot_state.json ]; then
            echo "--- utbot_state.json ---"
            cat utbot_state.json
          else
            echo "utbot_state.json not found"
          fi

          echo ""

          if [ -f utbot_trade_history.json ]; then
            echo "--- utbot_trade_history.json ---"
            cat utbot_trade_history.json
          else
            echo "utbot_trade_history.json not found"
          fi

          echo ""

          if [ -f .utbot_15m_reset_done ]; then
            echo "15M reset marker: FOUND"
          else
            echo "15M reset marker: NOT FOUND"
          fi

      # ============================================================
      # RUN SCANNER
      # ============================================================
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"

        run: |
          echo "======================================"
          echo "Starting Crypto UT Bot Scanner"
          echo "======================================"

          python -u scanner.py

      # ============================================================
      # SHOW FINAL STATE
      # ============================================================
      - name: Show scanner state
        if: always()
        run: |
          echo "======================================"
          echo "FINAL SCANNER STATE"
          echo "======================================"

          echo ""
          echo "======================================"
          echo "utbot_state.json"
          echo "======================================"

          if [ -f utbot_state.json ]; then
            cat utbot_state.json
          else
            echo "utbot_state.json not found"
          fi

          echo ""
          echo "======================================"
          echo "utbot_trade_history.json"
          echo "======================================"

          if [ -f utbot_trade_history.json ]; then
            cat utbot_trade_history.json
          else
            echo "utbot_trade_history.json not found"
          fi

          echo ""
          echo "======================================"
          echo "15M RESET MARKER"
          echo "======================================"

          if [ -f .utbot_15m_reset_done ]; then
            echo "RESET MARKER EXISTS"
            cat .utbot_15m_reset_done
          else
            echo "RESET MARKER NOT FOUND"
          fi

      # ============================================================
      # COMMIT STATE
      # ============================================================
      - name: Commit scanner state
        if: always()
        run: |
          echo "======================================"
          echo "Saving scanner state to GitHub"
          echo "======================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add utbot_state.json
          git add utbot_trade_history.json
          git add .utbot_15m_reset_done

          echo ""
          echo "======================================"
          echo "Git status"
          echo "======================================"

          git status --short

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update 15M UT Bot scanner state"
            git push
            echo "Scanner state successfully saved."
          fi
