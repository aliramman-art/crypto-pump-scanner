name: Crypto UT Bot Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      # =====================================================
      # CHECK FILES
      # =====================================================

      - name: Check scanner files
        run: |
          echo "======================================"
          echo "Repository files"
          echo "======================================"
          ls -la

          echo ""
          echo "======================================"
          echo "Python version"
          echo "======================================"
          python --version

          echo ""
          echo "======================================"
          echo "Scanner file"
          echo "======================================"

          if [ ! -f scanner.py ]; then
            echo "ERROR: scanner.py not found!"
            exit 1
          fi

          echo "scanner.py found."

      # =====================================================
      # CHECK TELEGRAM SECRETS
      # =====================================================

      - name: Check Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "======================================"
          echo "Telegram configuration check"
          echo "======================================"

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is EMPTY"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is EMPTY"
            exit 1
          fi

          echo "TELEGRAM_BOT_TOKEN: OK"
          echo "TELEGRAM_CHAT_ID: OK"

      # =====================================================
      # TELEGRAM CONNECTION TEST
      # =====================================================

      - name: Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "======================================"
          echo "Testing Telegram connection"
          echo "======================================"

          RESPONSE=$(curl -sS \
            --get \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=🧪 UT Bot Scanner - GitHub Actions connection test" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")

          echo "Telegram response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram connection: SUCCESS"
          else
            echo "Telegram connection: FAILED"
            exit 1
          fi

      # =====================================================
      # RUN SCANNER
      # =====================================================

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "======================================"
          echo "Starting Crypto UT Bot Scanner"
          echo "======================================"

          python -u scanner.py

      # =====================================================
      # SHOW STATE / HISTORY
      # =====================================================

      - name: Show scanner state
        if: always()
        run: |
          echo "======================================"
          echo "Scanner state"
          echo "======================================"

          if [ -f utbot_state.json ]; then
            echo "--- utbot_state.json ---"
            cat utbot_state.json
          else
            echo "utbot_state.json not found"
          fi

          echo ""
          echo "--- trade history ---"

          if [ -f utbot_trade_history.json ]; then
            cat utbot_trade_history.json
          else
            echo "utbot_trade_history.json not found"
          fi

      # =====================================================
      # SAVE STATE TO GITHUB
      # =====================================================

      - name: Commit scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add utbot_state.json utbot_trade_history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update UT Bot scanner state"
            git push
          fi
