name: Crypto UT Bot Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # INSTALL
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      # ============================================================
      # CHECK FILES
      # ============================================================
      - name: Check files
        run: |
          echo "======================================"
          echo "CHECKING FILES"
          echo "======================================"

          pwd
          ls -la

          echo ""

          if [ ! -f scanner.py ]; then
            echo "ERROR: scanner.py NOT FOUND"
            exit 1
          fi

          echo "scanner.py FOUND"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Installed packages:"
          pip show ccxt pandas numpy requests

      # ============================================================
      # TELEGRAM CHECK
      # ============================================================
      - name: Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          echo "======================================"
          echo "TELEGRAM TEST"
          echo "======================================"

          RESPONSE=$(curl -sS \
            --max-time 20 \
            --get \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=🧪 UT Bot Scanner - GitHub Actions connection test" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram: OK"
          else
            echo "Telegram: FAILED"
            exit 1
          fi

      # ============================================================
      # SHOW STATE
      # ============================================================
      - name: Show previous state
        run: |
          echo "======================================"
          echo "PREVIOUS STATE"
          echo "======================================"

          if [ -f utbot_state.json ]; then
            cat utbot_state.json
          else
            echo "No utbot_state.json"
          fi

          echo ""

          if [ -f utbot_trade_history.json ]; then
            cat utbot_trade_history.json
          else
            echo "No utbot_trade_history.json"
          fi

          echo ""

          if [ -f .utbot_15m_reset_done ]; then
            echo "15M RESET MARKER: EXISTS"
          else
            echo "15M RESET MARKER: NOT FOUND"
          fi

      # ============================================================
      # RUN SCANNER
      # ============================================================
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"

        run: |
          echo "======================================"
          echo "STARTING SCANNER"
          echo "======================================"

          date -u

          echo ""
          echo "Running scanner.py ..."
          echo ""

          timeout 8m python -u scanner.py

          EXIT_CODE=$?

          echo ""
          echo "======================================"
          echo "SCANNER EXIT CODE: $EXIT_CODE"
          echo "======================================"

          exit $EXIT_CODE

      # ============================================================
      # SHOW FINAL STATE
      # ============================================================
      - name: Show final state
        if: always()
        run: |
          echo "======================================"
          echo "FINAL STATE"
          echo "======================================"

          echo ""
          echo "utbot_state.json"
          echo "--------------------------------------"

          if [ -f utbot_state.json ]; then
            cat utbot_state.json
          else
            echo "NOT FOUND"
          fi

          echo ""
          echo "utbot_trade_history.json"
          echo "--------------------------------------"

          if [ -f utbot_trade_history.json ]; then
            cat utbot_trade_history.json
          else
            echo "NOT FOUND"
          fi

          echo ""
          echo ".utbot_15m_reset_done"
          echo "--------------------------------------"

          if [ -f .utbot_15m_reset_done ]; then
            cat .utbot_15m_reset_done
          else
            echo "NOT FOUND"
          fi

      # ============================================================
      # COMMIT STATE
      # ============================================================
      - name: Commit scanner state
        if: always()
        run: |
          echo "======================================"
          echo "SAVING STATE"
          echo "======================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add utbot_state.json 2>/dev/null || true
          git add utbot_trade_history.json 2>/dev/null || true
          git add .utbot_15m_reset_done 2>/dev/null || true

          echo ""
          echo "Git status:"
          git status --short

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update 15M UT Bot scanner state"
            git push
            echo "State saved successfully."
          fi
