name: Pump Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Get code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save price history

        run: |

          git config user.name "Pump Scanner"
          git config user.email "pump-scanner@users.noreply.github.com"

          git add price_data.json

          git diff --cached --quiet || git commit -m "Update price history"

          git push
