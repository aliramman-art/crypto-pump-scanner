name: NDS 5M Live Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nds-5m-live-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: nds_5m_v20.db
          key: nds-5m-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nds-5m-db-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pandas matplotlib

      - name: Run NDS 5M scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nds_5m_live_scanner.py

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: nds_5m_v20.db
          key: nds-5m-db-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nds-5m-charts-${{ github.run_id }}
          path: charts/
          if-no-files-found: ignore
          retention-days: 7
