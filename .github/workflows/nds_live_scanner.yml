name: NDS Live Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nds-live-scanner
  cancel-in-progress: false

jobs:
  nds-scanner:
    runs-on: ubuntu-latest

    timeout-minutes: 4

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # RESTORE DATABASE
      # ======================================================

      - name: Restore NDS database
        uses: actions/cache/restore@v4
        with:
          path: nds_v11.db
          key: nds-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nds-db-${{ github.ref_name }}-


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib


      # ======================================================
      # RUN SCANNER
      # ======================================================

      - name: Run NDS scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nds_live_scanner_v14.py


      # ======================================================
      # SAVE DATABASE
      # ======================================================

      - name: Save NDS database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: nds_v11.db
          key: nds-db-${{ github.ref_name }}-${{ github.run_id }}


      # ======================================================
      # UPLOAD CHARTS
      # ======================================================

      - name: Upload NDS charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nds-charts-${{ github.run_id }}
          path: charts/
          if-no-files-found: ignore
          retention-days: 7
