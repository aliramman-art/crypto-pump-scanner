name: NDS M1 Hook Live Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: nds-m1-hook-live-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      - name: Check scanner file
        run: |
          echo "Checking scanner file..."

          if [ ! -f "nds_m1_hook_live_scanner_v593_fixed.py" ]; then
            echo "ERROR: nds_m1_hook_live_scanner_v593_fixed.py not found."
            echo "Available NDS scanner files:"
            ls -lah | grep -i "nds.*scanner" || true
            exit 1
          fi

          echo "Scanner file:"
          ls -lh nds_m1_hook_live_scanner_v593_fixed.py

          echo "Checking version..."
          grep -m1 'VERSION = ' nds_m1_hook_live_scanner_v593_fixed.py || true

      - name: Run NDS M1 scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nds_m1_hook_live_scanner_v593_fixed.py

      - name: Save M1 database and charts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f "nds_m1_v592.db" ]; then
            git add -f nds_m1_v592.db
            echo "M1 database found and staged."
          else
            echo "WARNING: nds_m1_v592.db not found."
          fi

          if [ -d "nds_m1_charts" ]; then
            git add -f nds_m1_charts/
            echo "M1 charts found and staged."
          else
            echo "No M1 charts directory found."
          fi

          if git diff --cached --quiet; then
            echo "No database/chart changes to commit."
          else
            git commit -m "Update NDS M1 scanner database and charts"
            git push origin HEAD:main
          fi
