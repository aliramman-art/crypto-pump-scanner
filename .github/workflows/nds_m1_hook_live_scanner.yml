name: NDS M1 Hook Live Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: nds-m1-hook-live-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      - name: Check scanner and database before scan
        run: |
          set -euo pipefail

          echo "===== GIT STATE BEFORE SCAN ====="
          git rev-parse HEAD
          git status --short
          git ls-files -s nds_m1_v592.db || true

          echo "===== DATABASE FILES ====="
          find . -maxdepth 3 -type f -name "*.db" -printf '%p %s bytes\n'

          echo "===== DATABASE HISTORY ====="
          git log -5 --oneline -- nds_m1_v592.db || true

          echo "===== SCANNER VERSION ====="
          test -f nds_m1_hook_live_scanner_v595.py
          grep -m1 'VERSION = ' nds_m1_hook_live_scanner_v595.py

          echo "===== DATABASE DIAGNOSTICS BEFORE SCAN ====="
          python - <<'PY'
          import os
          import sqlite3
          import hashlib

          path = os.path.abspath("nds_m1_v592.db")
          print("EXPECTED_DB_PATH:", path)
          print("EXISTS:", os.path.exists(path))

          if not os.path.exists(path):
              print("DATABASE DOES NOT EXIST BEFORE SCAN")
              raise SystemExit(0)

          print("SIZE_BYTES:", os.path.getsize(path))
          with open(path, "rb") as f:
              print("SHA256:", hashlib.sha256(f.read()).hexdigest())

          con = sqlite3.connect("file:" + path + "?mode=ro", uri=True)
          print("INTEGRITY:", con.execute("PRAGMA integrity_check").fetchone()[0])

          tables = [
              r[0] for r in con.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
              )
          ]
          print("TABLES:", tables)

          for table in tables:
              safe = '"' + table.replace('"', '""') + '"'
              count = con.execute(
                  f"SELECT COUNT(*) FROM {safe}"
              ).fetchone()[0]
              print(f"ROW_COUNT {table}: {count}")

          if "trades" in tables:
              cols = [
                  r[1] for r in con.execute('PRAGMA table_info("trades")')
              ]
              print("TRADES_COLUMNS:", cols)

              if "id" in cols:
                  rows = con.execute(
                      'SELECT * FROM "trades" ORDER BY id DESC LIMIT 20'
                  ).fetchall()
              else:
                  rows = con.execute(
                      'SELECT * FROM "trades" LIMIT 20'
                  ).fetchall()

              print("LATEST_TRADE_ROWS:")
              for row in rows:
                  print(dict(zip(cols, row)))

          con.close()
          PY

      - name: Run NDS M1 scanner v5.9.5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nds_m1_hook_live_scanner_v595.py

      - name: Verify database after scan
        if: always()
        run: |
          echo "===== DATABASE DIAGNOSTICS AFTER SCAN ====="
          python - <<'PY'
          import os
          import sqlite3
          import hashlib

          path = os.path.abspath("nds_m1_v592.db")
          print("EXPECTED_DB_PATH:", path)
          print("EXISTS:", os.path.exists(path))

          if not os.path.exists(path):
              print("DATABASE MISSING AFTER SCAN")
              raise SystemExit(0)

          print("SIZE_BYTES:", os.path.getsize(path))
          with open(path, "rb") as f:
              print("SHA256:", hashlib.sha256(f.read()).hexdigest())

          con = sqlite3.connect("file:" + path + "?mode=ro", uri=True)
          print("INTEGRITY:", con.execute("PRAGMA integrity_check").fetchone()[0])

          tables = [
              r[0] for r in con.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
              )
          ]
          print("TABLES:", tables)

          for table in tables:
              safe = '"' + table.replace('"', '""') + '"'
              count = con.execute(
                  f"SELECT COUNT(*) FROM {safe}"
              ).fetchone()[0]
              print(f"ROW_COUNT {table}: {count}")

          if "trades" in tables:
              cols = [
                  r[1] for r in con.execute('PRAGMA table_info("trades")')
              ]
              print("TRADES_COLUMNS:", cols)

              if "id" in cols:
                  rows = con.execute(
                      'SELECT * FROM "trades" ORDER BY id DESC LIMIT 20'
                  ).fetchall()
              else:
                  rows = con.execute(
                      'SELECT * FROM "trades" LIMIT 20'
                  ).fetchall()

              print("LATEST_TRADE_ROWS:")
              for row in rows:
                  print(dict(zip(cols, row)))

          con.close()
          PY

      - name: Save database and charts
        if: always()
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===== FILES BEFORE COMMIT ====="
          git status --short

          if [ -f "nds_m1_v592.db" ]; then
            git add -f nds_m1_v592.db
          else
            echo "WARNING: Database file is missing."
          fi

          if [ -d "nds_m1_charts" ]; then
            git add -f nds_m1_charts/
          fi

          echo "===== STAGED CHANGES ====="
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "NO DATABASE OR CHART CHANGES TO COMMIT"
          else
            git commit -m "Persist NDS M1 scanner database and charts"
            git push origin HEAD:main
            echo "DATABASE_AND_CHART_PUSH_SUCCESS"
          fi

          echo "===== FINAL GIT STATE ====="
          git status --short
          git log -3 --oneline -- nds_m1_v592.db
