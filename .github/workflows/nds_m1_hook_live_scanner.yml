name: NDS M1 Hook Live Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: nds-m1-hook-live-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      - name: Check scanner and recover database
        shell: bash
        run: |
          set -euo pipefail

          SCANNER="nds_m1_hook_live_scanner_v593_fixed.py"
          DB="nds_m1_v592.db"

          if [ ! -f "$SCANNER" ]; then
            echo "ERROR: Scanner file not found: $SCANNER"
            exit 1
          fi

          echo "Scanner version:"
          grep -m1 'VERSION = ' "$SCANNER"

          echo "Current commit:"
          git rev-parse HEAD

          if [ ! -f "$DB" ]; then
            echo "WARNING: Database is missing from the working tree."

            DB_COMMIT="$(git log -1 --format='%H' -- "$DB" || true)"

            if [ -z "$DB_COMMIT" ]; then
              echo "ERROR: No previous committed database was found."
              echo "Stopping to avoid silently starting with empty trade history."
              exit 1
            fi

            git show "${DB_COMMIT}:${DB}" > "$DB"

            echo "Recovered database from commit: $DB_COMMIT"
          fi

          echo "Database before scan:"
          ls -lh "$DB"

          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("nds_m1_v592.db")
          con = sqlite3.connect(path)
          try:
              result = con.execute("PRAGMA integrity_check").fetchone()[0]
              print("SQLite integrity:", result)

              if result != "ok":
                  raise SystemExit("ERROR: Database integrity check failed.")

              tables = {
                  row[0] for row in
                  con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }

              print("Tables:", ", ".join(sorted(tables)))

              if "trades" in tables:
                  rows = con.execute(
                      "SELECT status, COUNT(*) FROM trades GROUP BY status"
                  ).fetchall()
                  print("Trade counts:", rows)
              else:
                  raise SystemExit(
                      "ERROR: Expected trades table is missing."
                  )
          finally:
              con.close()
          PY

      - name: Run NDS M1 scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nds_m1_hook_live_scanner_v593_fixed.py

      - name: Verify database after scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          DB="nds_m1_v592.db"

          if [ ! -f "$DB" ]; then
            echo "ERROR: Database is missing after scan."
            exit 1
          fi

          echo "Database after scan:"
          ls -lh "$DB"

          python - <<'PY'
          import sqlite3

          con = sqlite3.connect("nds_m1_v592.db")
          try:
              result = con.execute("PRAGMA integrity_check").fetchone()[0]
              print("SQLite integrity:", result)

              if result != "ok":
                  raise SystemExit("ERROR: Database integrity check failed.")

              tables = {
                  row[0] for row in
                  con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }

              if "trades" in tables:
                  print(
                      "Trade counts:",
                      con.execute(
                          "SELECT status, COUNT(*) FROM trades GROUP BY status"
                      ).fetchall()
                  )
          finally:
              con.close()
          PY

      - name: Save database and charts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f "nds_m1_v592.db" ]; then
            git add -f nds_m1_v592.db
          else
            echo "ERROR: Database missing; nothing to save."
            exit 1
          fi

          if [ -d "nds_m1_charts" ]; then
            git add -f nds_m1_charts/
          fi

          if git diff --cached --quiet; then
            echo "No database or chart changes to commit."
          else
            git commit -m "Persist NDS M1 database and charts"
            git push origin HEAD:main
          fi
