name: NDS M5 Structure M1 CCI Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nds-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests matplotlib

      - name: Run NDS scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          PYTHONUNBUFFERED: "1"
        run: python nds_m1_hook_live_scanner_v595.py

      - name: Persist paper-trading database
        if: always()
        run: |
          if [ -f nds_m1_v592.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nds_m1_v592.db
            if ! git diff --cached --quiet; then
              git commit -m "Update NDS paper-trading database [skip ci]"
              git push
            fi
          else
            echo "Database file not found; nothing to persist."
          fi
