name: NDS M1 Hook Live Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: nds-m1-hook-live-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      - name: Check scanner file
        run: |
          echo "Checking scanner file..."
          if [ ! -f "nds_m1_hook_live_scanner_v592.py" ]; then
            echo "ERROR: nds_m1_hook_live_scanner_v592.py not found."
            echo "Available NDS scanner files:"
            ls -lah | grep -i "nds.*scanner" || true
            exit 1
          fi

          echo "Scanner file:"
          ls -lh nds_m1_hook_live_scanner_v592.py

          echo "Checking version..."
          grep -m1 'VERSION = ' nds_m1_hook_live_scanner_v592.py || true

      - name: Run NDS M1 scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nds_m1_hook_live_scanner_v592.py

      - name: Save database and charts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nds_h4_m5_v546.db nds_h4_m5_charts/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No database/chart changes to commit."
          else
            git commit -m "Update NDS M1 scanner database and charts"
            git push
          fi
