name: NDS M5 Long Short Structure Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: nds-m5-long-short-structure-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      UNIVERSE_SIZE: "100"
      MAX_OPEN_TRADES: "3"
      MAX_SIGNAL_AGE_HOURS: "6"
      DB_PATH: nds_m5_long_short_structure_v1.db
      CHART_DIR: nds_m5_long_short_structure_charts
      REPORT_TIMEZONE: Europe/Berlin
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas matplotlib

      - name: Restore previous database
        uses: actions/cache/restore@v4
        with:
          path: nds_m5_long_short_structure_v1.db
          key: nds-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nds-db-

      - name: Run NDS Scanner
        run: python -u nds_m5_long_short_structure_scanner_v1_3.py

      - name: Save database
        if: always() && hashFiles('nds_m5_long_short_structure_v1.db') != ''
        uses: actions/cache/save@v4
        with:
          path: nds_m5_long_short_structure_v1.db
          key: nds-db-${{ github.run_id }}-${{ github.run_attempt }}
