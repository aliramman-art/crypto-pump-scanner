name: Reverse-Tenkan 21 Coins v1.5

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: reverse-tenkan-21coins-v15
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scanner:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      # ============================================================
      # RUN REVERSE-TENKAN
      # ============================================================

      - name: Run Reverse-Tenkan 21 Coins
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python reverse_tenkan_21coins_v15.py

      # ============================================================
      # SAVE STATE
      # ============================================================

      - name: Commit state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reverse_tenkan_multi_state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Reverse-Tenkan 21 coins state"
            git push
          fi
