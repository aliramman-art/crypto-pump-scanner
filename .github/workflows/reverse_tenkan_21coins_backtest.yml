name: Reverse-Tenkan 21 Coins 30D Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run 30-Day Backtest
        run: |
          python reverse_tenkan_21coins_backtest_30d.py

      - name: Upload Backtest Results
        uses: actions/upload-artifact@v4
        with:
          name: reverse-tenkan-21coins-30d-results
          path: |
            reverse_tenkan_21coins_30d_results.csv
            reverse_tenkan_21coins_30d_trades.csv
