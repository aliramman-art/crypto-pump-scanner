name: SUI Ichimoku Pivot Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON 3.11
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      # ======================================================
      # RUN BACKTEST
      # ======================================================

      - name: Run SUI Ichimoku Pivot Backtest
        run: |
          python sui_ichimoku_pivot_backtest.py

      # ======================================================
      # SHOW SUMMARY
      # ======================================================

      - name: Show Backtest Summary
        if: always()
        run: |
          echo "=============================================="
          echo "SUI ICHIMOKU PIVOT BACKTEST SUMMARY"
          echo "=============================================="

          if [ -f sui_ichimoku_pivot_summary.csv ]; then
            cat sui_ichimoku_pivot_summary.csv
          else
            echo "Summary file not found."
          fi

      # ======================================================
      # UPLOAD RESULTS
      # ======================================================

      - name: Upload Backtest Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SUI-Ichimoku-Pivot-Backtest
          path: |
            sui_ichimoku_pivot_trades.csv
            sui_ichimoku_pivot_summary.csv
          if-no-files-found: warn
