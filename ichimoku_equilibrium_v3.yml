name: ICHIMOKU EQUILIBRIUM v3.0 - DOGE 12M BACKTEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      # ======================================================
      # RUN BACKTEST
      # ======================================================

      - name: Run Ichimoku Equilibrium v3 Backtest
        run: |
          python ichimoku_equilibrium_v3.py

      # ======================================================
      # SHOW GENERATED FILES
      # ======================================================

      - name: Check output files
        if: always()
        run: |
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          ls -lah

          echo ""
          echo "Checking Ichimoku Equilibrium output..."

          if [ -f "ichimoku_equilibrium_v3_trades.csv" ]; then
            echo "OK: ichimoku_equilibrium_v3_trades.csv"
          else
            echo "MISSING: ichimoku_equilibrium_v3_trades.csv"
          fi

      # ======================================================
      # UPLOAD BACKTEST ARTIFACT
      # ======================================================

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ichimoku-equilibrium-v3-results
          path: |
            ichimoku_equilibrium_v3_trades.csv
          if-no-files-found: warn
